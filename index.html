<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24 font-sans select-none">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
        <i class="fa-solid fa-layer-group text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight leading-none text-slate-800">Life Tracker</h1>
        <p class="text-[10px] font-medium text-slate-400 leading-tight mt-0.5" id="headerDate">Loading...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="globalDriveStatus" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold border border-slate-200 text-slate-400 bg-white shadow-sm">
        <i class="fa-brands fa-google-drive"></i> Offline
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-5" id="mainContainer">
    <!-- Dynamic views injected via JS: Home, Expenses, Items, Settings -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-slate-200 max-w-md mx-auto">
    <div class="flex items-center justify-around py-2">
      <button onclick="navigate('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-blue-600 flex-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-semibold">Home</span>
      </button>
      <button onclick="navigate('expenses')" id="nav-expenses" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span class="text-[10px] font-medium">Expenses</span>
      </button>
      
      <!-- Primary FAB (+) -->
      <div class="relative -top-4 flex items-center justify-center flex-1">
        <button onclick="openQuickAddModal()" class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/40 hover:bg-blue-700 active:scale-95 transition">
          <i class="fa-solid fa-plus text-xl"></i>
        </button>
      </div>

      <button onclick="navigate('items')" id="nav-items" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-calendar-check text-lg"></i>
        <span class="text-[10px] font-medium">Due Items</span>
      </button>
      <button onclick="navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] font-medium">Settings</span>
      </button>
    </div>
  </nav>

  <!-- Quick Add Action Sheet Modal -->
  <div id="quickAddModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end justify-center transition-opacity" onclick="closeQuickAddModal(event)">
    <div class="bg-white w-full max-w-md rounded-t-2xl p-5 shadow-2xl space-y-4 transform transition-transform" onclick="event.stopPropagation()">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-2"></div>
      <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Quick Record</h3>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openExpenseForm(); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-emerald-500/10 text-emerald-600 flex items-center justify-center font-bold">₹</div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Expense</p><p class="text-[10px] text-slate-400">Track spending</p></div>
        </button>
        <button onclick="openDueItemForm('Bill'); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-rose-500/10 text-rose-600 flex items-center justify-center"><i class="fa-solid fa-file-invoice-dollar text-sm"></i></div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Bill</p><p class="text-[10px] text-slate-400">Utility, Rent, EMI</p></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Common Generic Form Modal -->
  <div id="formModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="formModalContent" class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <!-- Injected form fields dynamically -->
    </div>
  </div>

  <script>
    // --- Application State ---
    const DB_KEY = 'life_tracker_pwa_data';
    const G_CLIENT_ID_KEY = 'life_tracker_gclient_id';
    const G_FOLDER_KEY = 'life_tracker_gfolder_name';

    let appData = {
      expenses: [],
      items: [],
      categories: ['Food', 'Bills', 'Groceries', 'Transport', 'Shopping', 'Entertainment', 'Health', 'Travel']
    };

    let gdriveToken = null;
    let tokenClient = null;

    function initStorage() {
      const saved = localStorage.getItem(DB_KEY);
      if (saved) {
        try { appData = JSON.parse(saved); } catch (e) { console.error('Corrupt data:', e); }
      }
      document.getElementById('headerDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      navigate('home');
    }

    function saveState() {
      localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    // --- Core Views & Navigation ---
    let currentTab = 'home';
    function navigate(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-slate-400');
      });
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) {
        activeNav.classList.add('text-blue-600');
        activeNav.classList.remove('text-slate-400');
      }

      const container = document.getElementById('mainContainer');
      if (tab === 'home') renderHome(container);
      else if (tab === 'expenses') renderExpenses(container);
      else if (tab === 'items') renderItems(container);
      else if (tab === 'settings') renderSettings(container);
    }

    // --- Home Screen View ---
    function renderHome(container) {
      const todayStr = new Date().toISOString().split('T')[0];
      const todaySpending = appData.expenses.filter(e => e.date === todayStr).reduce((sum, e) => sum + Number(e.amount), 0);
      
      container.innerHTML = `
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm text-center">
          <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Spent Today</p>
          <p class="text-3xl font-bold text-slate-800 mt-1">₹${todaySpending.toLocaleString()}</p>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Recent Spending</h3>
          <div class="bg-white rounded-2xl border border-slate-100 divide-y divide-slate-50 overflow-hidden shadow-xs">
            ${appData.expenses.slice(-4).reverse().map(e => `
              <div class="p-3 flex items-center justify-between">
                <div>
                  <p class="text-xs font-bold text-slate-800">${e.note || e.category}</p>
                  <p class="text-[10px] text-slate-400">${e.category} •${e.date}</p>
                </div>
                <p class="text-xs font-bold text-slate-800">₹${Number(e.amount).toLocaleString()}</p>
              </div>
            `).join('')}
            ${appData.expenses.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">No expenses recorded.</p>' : ''}
          </div>
        </div>
      `;
    }

    // --- Settings / Google Drive View ---
    function renderSettings(container) {
      const savedClientId = localStorage.getItem(G_CLIENT_ID_KEY) || '';
      const savedFolder = localStorage.getItem(G_FOLDER_KEY) || 'Life Tracker Sync';
      const isConnected = !!gdriveToken;

      container.innerHTML = `
        <h2 class="text-sm font-bold text-slate-800 mb-3">Settings & Cloud Backup</h2>
        
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-4">
          <div class="flex items-center gap-2 mb-2">
            <i class="fa-brands fa-google-drive text-amber-500 text-lg"></i>
            <h3 class="font-bold text-slate-800 text-sm">Google Drive Sync</h3>
          </div>
          
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Google OAuth Client ID</label>
            <input type="text" id="settingClientId" value="${savedClientId}" placeholder="xxxx.apps.googleusercontent.com" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Backup Folder Name</label>
            <input type="text" id="settingFolder" value="${savedFolder}" placeholder="Life Tracker Sync" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
            <p class="text-[9px] text-slate-400 mt-1">Data will reside here in your Google Drive.</p>
          </div>

          <div class="flex gap-2">
            <button onclick="saveDriveSettings()" class="flex-1 py-2 bg-slate-800 text-white rounded-xl text-xs font-medium hover:bg-slate-700 transition">Save Config</button>
            <button onclick="authenticateGoogleDrive()" class="flex-1 py-2 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 flex items-center justify-center gap-2 hover:bg-slate-50 transition">
               ${isConnected ? '<i class="fa-solid fa-check text-emerald-500"></i> Connected' : '<i class="fa-brands fa-google"></i> Connect Auth'}
            </button>
          </div>

          <div class="w-full h-px bg-slate-100 my-2"></div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="backupToGoogleDrive()" class="py-2.5 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 transition disabled:opacity-50" ${!isConnected ? 'disabled' : ''}>
              <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Upload to Drive
            </button>
            <button onclick="restoreFromGoogleDrive()" class="py-2.5 border border-blue-600 text-blue-600 rounded-xl text-xs font-semibold hover:bg-blue-50 transition disabled:opacity-50" ${!isConnected ? 'disabled' : ''}>
              <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Restore Data
            </button>
          </div>
          
          <p id="driveSyncNotice" class="text-[11px] text-center text-slate-400 font-medium h-4"></p>
        </div>
      `;
    }

    function saveDriveSettings() {
      const clientId = document.getElementById('settingClientId').value.trim();
      const folderName = document.getElementById('settingFolder').value.trim() || 'Life Tracker Sync';
      
      if (!clientId) return alert('Client ID is required.');
      
      localStorage.setItem(G_CLIENT_ID_KEY, clientId);
      localStorage.setItem(G_FOLDER_KEY, folderName);
      document.getElementById('driveSyncNotice').innerText = 'Configuration saved!';
      document.getElementById('driveSyncNotice').classList.add('text-emerald-500');
    }

    // --- Google Drive API Logic with Folders ---
    function authenticateGoogleDrive() {
      const clientId = localStorage.getItem(G_CLIENT_ID_KEY);
      if (!clientId) return alert('Please enter and save your Google Cloud OAuth Client ID first.');

      if (typeof google === 'undefined' || !google.accounts) {
        return alert('Google scripts are loading or offline. Check internet connection.');
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (response) => {
          if (response.error) {
            alert('Authentication failed: ' + response.error);
            return;
          }
          gdriveToken = response.access_token;
          
          // Update global header status
          const status = document.getElementById('globalDriveStatus');
          status.innerHTML = '<i class="fa-brands fa-google-drive text-amber-500"></i> Connected';
          status.classList.remove('text-slate-400');
          status.classList.add('text-slate-700');

          // Re-render settings if open
          if(currentTab === 'settings') renderSettings(document.getElementById('mainContainer'));
        }
      });
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    // Helper: Find or create the target folder
    async function getOrCreateFolder(folderName) {
      // 1. Search for folder
      const query = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`;
      const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
        headers: { Authorization: `Bearer ${gdriveToken}` }
      });
      const searchData = await searchRes.json();

      if (searchData.files && searchData.files.length > 0) {
        return searchData.files[0].id; // Folder exists
      }

      // 2. Create if not found
      const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: { 
          Authorization: `Bearer ${gdriveToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: folderName,
          mimeType: 'application/vnd.google-apps.folder'
        })
      });
      const createData = await createRes.json();
      return createData.id;
    }

    async function backupToGoogleDrive() {
      if (!gdriveToken) return alert('Authenticate with Google first!');
      const notice = document.getElementById('driveSyncNotice');
      notice.innerText = 'Preparing backup...';
      notice.className = 'text-[11px] text-center text-blue-500 font-medium h-4';

      try {
        const folderName = localStorage.getItem(G_FOLDER_KEY) || 'Life Tracker Sync';
        const folderId = await getOrCreateFolder(folderName);
        notice.innerText = `Found folder '${folderName}'... uploading...`;

        const fileName = 'life_tracker_data.json';
        const fileContent = JSON.stringify(appData, null, 2);
        
        // Search if file already exists IN THIS FOLDER
        const query = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
        const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
          headers: { Authorization: `Bearer ${gdriveToken}` }
        });
        const searchData = await searchRes.json();

        let endpoint = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
        let method = 'POST';
        
        let metadata = { name: fileName, mimeType: 'application/json' };
        
        if (searchData.files && searchData.files.length > 0) {
          // Update existing file
          const fileId = searchData.files[0].id;
          endpoint = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`;
          method = 'PATCH';
        } else {
          // Create new file, specify parent folder
          metadata.parents = [folderId];
        }

        const boundary = 'foo_bar_baz';
        const delimiter = "\r\n--" + boundary + "\r\n";
        const closeDelim = "\r\n--" + boundary + "--";
        const multipartRequestBody =
          delimiter +
          'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
          JSON.stringify(metadata) +
          delimiter +
          'Content-Type: application/json\r\n\r\n' +
          fileContent +
          closeDelim;

        const res = await fetch(endpoint, {
          method: method,
          headers: {
            Authorization: `Bearer ${gdriveToken}`,
            'Content-Type': `multipart/related; boundary=${boundary}`
          },
          body: multipartRequestBody
        });

        if (res.ok) {
          notice.innerText = 'Upload successful!';
          notice.className = 'text-[11px] text-center text-emerald-600 font-medium h-4';
        } else {
          throw new Error('Upload failed. API rejected request.');
        }
      } catch (err) {
        console.error(err);
        notice.innerText = 'Error: ' + err.message;
        notice.className = 'text-[11px] text-center text-rose-600 font-medium h-4';
      }
    }

    async function restoreFromGoogleDrive() {
      if (!gdriveToken) return alert('Authenticate with Google first!');
      const notice = document.getElementById('driveSyncNotice');
      notice.innerText = 'Searching Drive...';
      notice.className = 'text-[11px] text-center text-blue-500 font-medium h-4';

      try {
        const folderName = localStorage.getItem(G_FOLDER_KEY) || 'Life Tracker Sync';
        const folderId = await getOrCreateFolder(folderName);

        const query = `name='life_tracker_data.json' and '${folderId}' in parents and trashed=false`;
        const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
          headers: { Authorization: `Bearer ${gdriveToken}` }
        });
        const searchData = await searchRes.json();

        if (!searchData.files || searchData.files.length === 0) {
          notice.innerText = `No backup found in folder '${folderName}'.`;
          notice.className = 'text-[11px] text-center text-rose-600 font-medium h-4';
          return;
        }

        const fileId = searchData.files[0].id;
        const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
          headers: { Authorization: `Bearer ${gdriveToken}` }
        });

        const cloudData = await fileRes.json();
        if (cloudData && Array.isArray(cloudData.expenses)) {
          if (confirm('Are you sure you want to replace your current local data with the version from Google Drive?')) {
            appData = cloudData;
            saveState();
            notice.innerText = 'Data Restored Successfully!';
            notice.className = 'text-[11px] text-center text-emerald-600 font-medium h-4';
          }
        }
      } catch (err) {
        console.error(err);
        notice.innerText = 'Restore Error: ' + err.message;
        notice.className = 'text-[11px] text-center text-rose-600 font-medium h-4';
      }
    }

    // --- Stubbed Views & Forms ---
    function renderExpenses(container) {
      container.innerHTML = `<h2 class="text-sm font-bold text-slate-800">Expenses</h2><p class="text-xs text-slate-400 mt-2">Manage expenses here.</p>`;
    }
    function renderItems(container) {
      container.innerHTML = `<h2 class="text-sm font-bold text-slate-800">Due Items</h2><p class="text-xs text-slate-400 mt-2">Manage upcoming items here.</p>`;
    }
    function openQuickAddModal() { document.getElementById('quickAddModal').classList.remove('hidden'); }
    function closeQuickAddModal(e) { document.getElementById('quickAddModal').classList.add('hidden'); }
    function openExpenseForm() {}
    function openDueItemForm(type) {}

    // Initialize
    window.addEventListener('DOMContentLoaded', initStorage);
  </script>
</body>
</html>
