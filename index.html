<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24 font-sans select-none">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
        <i class="fa-solid fa-layer-group text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight leading-none text-slate-800">Life Tracker</h1>
        <p class="text-[10px] font-medium text-slate-400 leading-tight mt-0.5" id="headerDate">Loading...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="globalDriveStatus" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold border border-slate-200 text-slate-400 bg-white shadow-sm transition-colors duration-300">
        <i class="fa-brands fa-google-drive"></i> Offline
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-5" id="mainContainer">
    <!-- Dynamic views injected via JS: Home, Expenses, Items, Settings -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-slate-200 max-w-md mx-auto">
    <div class="flex items-center justify-around py-2">
      <button onclick="navigate('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-blue-600 flex-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-semibold">Home</span>
      </button>
      <button onclick="navigate('expenses')" id="nav-expenses" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span class="text-[10px] font-medium">Expenses</span>
      </button>
      
      <!-- Primary FAB (+) -->
      <div class="relative -top-4 flex items-center justify-center flex-1">
        <button onclick="openQuickAddModal()" class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/40 hover:bg-blue-700 active:scale-95 transition">
          <i class="fa-solid fa-plus text-xl"></i>
        </button>
      </div>

      <button onclick="navigate('items')" id="nav-items" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-calendar-check text-lg"></i>
        <span class="text-[10px] font-medium">Due Items</span>
      </button>
      <button onclick="navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] font-medium">Settings</span>
      </button>
    </div>
  </nav>

  <!-- Quick Add Action Sheet Modal -->
  <div id="quickAddModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end justify-center transition-opacity" onclick="closeQuickAddModal(event)">
    <div class="bg-white w-full max-w-md rounded-t-2xl p-5 shadow-2xl space-y-4 transform transition-transform" onclick="event.stopPropagation()">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-2"></div>
      <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Quick Record</h3>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openExpenseForm(); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-emerald-500/10 text-emerald-600 flex items-center justify-center font-bold">₹</div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Expense</p><p class="text-[10px] text-slate-400">Track spending</p></div>
        </button>
        <button onclick="openDueItemForm('Bill'); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-rose-500/10 text-rose-600 flex items-center justify-center"><i class="fa-solid fa-file-invoice-dollar text-sm"></i></div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Bill</p><p class="text-[10px] text-slate-400">Utility, Rent, EMI</p></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Common Generic Form Modal -->
  <div id="formModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="formModalContent" class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <!-- Injected form fields dynamically -->
    </div>
  </div>

  <script>
    // --- Application State ---
    const DB_KEY = 'life_tracker_pwa_data';
    const G_CLIENT_ID_KEY = 'life_tracker_gclient_id';
    const G_FOLDER_KEY = 'life_tracker_gfolder_name';

    // Returns a fresh copy of the default app data shape. Used on first run
    // and as the base to rebuild onto when restoring from Google Drive.
    function getDefaultAppData() {
      return {
        expenses: [],
        items: [],
        // Generic "tap a day to log it" items - milk, newspaper, whatever recurs daily.
        // Fully user-configurable in Settings, and rides along in the same backup blob.
        recurringItems: [
          { id: 'milk', name: 'Milk', category: 'Milk', subCategory: null, price: 50 }
        ],
        categories: {
          'Food': ['Restaurant', 'Delivery', 'Snacks', 'Coffee'],
          'Bills': ['Electricity', 'Water', 'Internet', 'Mobile', 'Rent', 'EMI'],
          'Groceries': ['Supermarket', 'Vegetables', 'Meat'],
          'Transport': ['Fuel', 'Taxi/Uber', 'Public Transit', 'Flights'],
          'Shopping': ['Clothes', 'Electronics', 'Gifts', 'Amazon'],
          'Entertainment': ['Netflix', 'Spotify', 'Movies', 'Gaming', 'Events'],
          'Health': ['Pharmacy', 'Doctor', 'Gym', 'Insurance'],
          'Travel': ['Hotels', 'Tickets', 'Tours'],
          'Milk': ['Cow Milk', 'Buffalo Milk', 'Toned Milk']
        }
      };
    }

    let appData = getDefaultAppData();

    let gdriveToken = null;
    let tokenClient = null;

    // Merges a parsed data blob (from localStorage or a Drive restore) into the
    // current appData, applying backwards-compatibility upgrades along the way.
    // Shared by initStorage() and restoreFromGoogleDrive() so both paths always
    // stay in sync - one place to fix migrations, not two.
    function mergeIntoAppData(parsedData) {
      if (!parsedData) return;

      if (parsedData.expenses) appData.expenses = parsedData.expenses;
      if (parsedData.items) appData.items = parsedData.items;

      // Recurring Daily Items (generic, user-configurable replacement for the
      // old hardcoded single "milkPrice" setting)
      if (Array.isArray(parsedData.recurringItems)) {
        appData.recurringItems = parsedData.recurringItems;
      } else if (typeof parsedData.milkPrice === 'number') {
        // Legacy upgrade path for users who saved data before this feature existed.
        appData.recurringItems = [{ id: 'milk', name: 'Milk', category: 'Milk', subCategory: null, price: parsedData.milkPrice }];
      }

      // Backwards Compatibility Migration for Categories
      if (parsedData.categories) {
        if (Array.isArray(parsedData.categories)) {
          parsedData.categories.forEach(cat => {
            if (!appData.categories[cat]) {
              appData.categories[cat] = [];
            }
          });
        } else {
          // Merge saved categories on top of defaults so newly introduced
          // built-in categories (e.g. Milk) still show up for existing users.
          appData.categories = { ...appData.categories, ...parsedData.categories };
        }
      }
    }

    function initStorage() {
      const saved = localStorage.getItem(DB_KEY);
      if (saved) {
        try {
          mergeIntoAppData(JSON.parse(saved));
        } catch (e) { console.error('Corrupt data:', e); }
      }
      
      document.getElementById('headerDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      navigate('home');
    }

    function saveState() {
      localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    // --- Core Views & Navigation ---
    let currentTab = 'home';
    function navigate(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-slate-400');
      });
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) {
        activeNav.classList.add('text-blue-600');
        activeNav.classList.remove('text-slate-400');
      }

      const container = document.getElementById('mainContainer');
      if (tab === 'home') renderHome(container);
      else if (tab === 'expenses') renderExpenses(container);
      else if (tab === 'items') renderItems(container);
      else if (tab === 'settings') renderSettings(container);
    }

    // --- Home Screen View ---
    // Shared row renderer for an expense line-item, with a delete button, used by
    // both the Home "Recent Spending" preview and the full Expenses tab list so
    // there's one place to change the markup, not two copies drifting apart.
    function renderExpenseRow(e, wrapperClass) {
      return `
        <div class="${wrapperClass} flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p class="text-xs font-bold text-slate-800 truncate">${e.note || e.category}</p>
            <p class="text-[10px] text-slate-400 truncate">${e.category}${e.subCategory ? ' &raquo; ' + e.subCategory : ''} &bull; ${e.date}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <p class="text-xs font-bold text-slate-800">₹${Number(e.amount).toLocaleString()}</p>
            <button onclick="deleteExpense('${e.id}')" class="w-6 h-6 rounded-full flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition" title="Delete expense">
              <i class="fa-solid fa-trash text-[11px]"></i>
            </button>
          </div>
        </div>
      `;
    }

    function deleteExpense(id) {
      const exp = appData.expenses.find(e => e.id === id);
      if (!exp) return;
      if (!confirm(`Delete this expense?\n\n${exp.note || exp.category} \u2022 \u20b9${Number(exp.amount).toLocaleString()} \u2022 ${exp.date}`)) return;

      appData.expenses = appData.expenses.filter(e => e.id !== id);
      saveState();
      navigate(currentTab);
    }

    function renderHome(container) {
      const todayStr = new Date().toISOString().split('T')[0];
      const currentMonthStr = todayStr.slice(0, 7); // YYYY-MM
      const todaySpending = appData.expenses.filter(e => e.date === todayStr).reduce((sum, e) => sum + Number(e.amount), 0);
      const monthSpending = appData.expenses.filter(e => e.date.startsWith(currentMonthStr)).reduce((sum, e) => sum + Number(e.amount), 0);
      
      container.innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Spent Today</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">₹${todaySpending.toLocaleString()}</p>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">This Month</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">₹${monthSpending.toLocaleString()}</p>
          </div>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Recent Spending</h3>
          <div class="bg-white rounded-2xl border border-slate-100 divide-y divide-slate-50 overflow-hidden shadow-xs">
            ${appData.expenses.slice(-4).reverse().map(e => renderExpenseRow(e, 'p-3')).join('')}
            ${appData.expenses.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">No expenses recorded.</p>' : ''}
          </div>
        </div>
      `;
    }

    // --- Working Expenses & Items Views ---
    let expenseFilterMonth = new Date().toISOString().slice(0, 7); // YYYY-MM
    let selectedRecurringItemId = null;

    function renderExpenses(container) {
      const monthExpenses = appData.expenses.filter(e => e.date.startsWith(expenseFilterMonth));
      const monthTotal = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
      const [fYear, fMonth] = expenseFilterMonth.split('-').map(Number);
      const monthLabel = new Date(fYear, fMonth - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const activeItem = appData.recurringItems.find(i => i.id === selectedRecurringItemId) || appData.recurringItems[0] || null;

      container.innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">All Expenses</h2>
          <button onclick="openExpenseForm()" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm hover:bg-blue-700">+ Add Expense</button>
        </div>

        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-3">
          <div>
            <label class="text-[10px] font-semibold text-slate-400 block mb-1">Filter by Month</label>
            <input type="month" value="${expenseFilterMonth}" onchange="onExpenseMonthChange(this.value)" class="text-xs p-2 rounded-lg border border-slate-200 outline-none focus:border-blue-500 bg-white">
          </div>
          <div class="text-right">
            <p class="text-[10px] font-semibold text-slate-400 uppercase">${monthLabel} Total</p>
            <p class="text-lg font-bold text-slate-800">₹${monthTotal.toLocaleString()}</p>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-repeat text-blue-400"></i> Daily Recurring Calendar</h3>
          </div>
          ${appData.recurringItems.length === 0 ? `
            <p class="text-[11px] text-slate-400 text-center py-4">No recurring items yet. Add one (e.g. Milk, Newspaper) in Settings.</p>
          ` : `
            <div class="flex items-center justify-between gap-2 mb-3">
              <select id="recurringItemSelect" onchange="onRecurringItemChange(this.value)" class="flex-1 text-xs p-2 rounded-lg border border-slate-200 outline-none focus:border-blue-500 bg-white">
                ${appData.recurringItems.map(item => `<option value="${item.id}" ${item.id === activeItem.id ? 'selected' : ''}>${item.name}</option>`).join('')}
              </select>
              <span class="text-[10px] text-slate-400 whitespace-nowrap">₹${Number(activeItem.price).toLocaleString()}/day</span>
            </div>
            <div id="recurringCalendarGrid" class="grid grid-cols-7 gap-1.5">
              ${buildRecurringCalendarHtml(activeItem, expenseFilterMonth)}
            </div>
          `}
        </div>

        <div class="space-y-2 mt-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">${monthLabel} Expenses</h3>
          ${monthExpenses.slice().reverse().map(e => renderExpenseRow(e, 'bg-white p-3 rounded-xl border border-slate-100 shadow-sm hover:bg-slate-50 transition')).join('')}
          ${monthExpenses.length === 0 ? '<div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-200"><p class="text-xs text-slate-400">No expenses recorded for this month.</p></div>' : ''}
        </div>
      `;
    }

    function onExpenseMonthChange(value) {
      if (!value) return;
      expenseFilterMonth = value;
      navigate('expenses');
    }

    function onRecurringItemChange(id) {
      selectedRecurringItemId = id;
      navigate('expenses');
    }

    function buildRecurringCalendarHtml(item, monthStr) {
      const [year, month] = monthStr.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      let html = '';
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${monthStr}-${String(day).padStart(2, '0')}`;
        const logged = appData.expenses.some(e => e.id === item.id + '_' + dateStr);
        html += `
          <button onclick="toggleRecurringDay('${item.id}', '${dateStr}')" class="aspect-square rounded-lg text-[11px] font-bold flex items-center justify-center border transition ${logged ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-blue-50'}">
            ${day}
          </button>
        `;
      }
      return html;
    }

    function toggleRecurringDay(itemId, dateStr) {
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item) return;

      const entryId = itemId + '_' + dateStr;
      const existingIdx = appData.expenses.findIndex(e => e.id === entryId);

      if (existingIdx > -1) {
        appData.expenses.splice(existingIdx, 1);
      } else {
        appData.expenses.push({
          id: entryId,
          amount: Number(item.price) || 0,
          category: item.category,
          subCategory: item.subCategory || null,
          date: dateStr,
          note: item.name
        });
      }
      saveState();
      navigate(currentTab);
    }

    function renderItems(container) {
      container.innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">Due & Expiry Tracking</h2>
          <button onclick="openDueItemForm('Bill')" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm hover:bg-blue-700">+ Add Item</button>
        </div>
        <div class="space-y-2 mt-3">
          ${appData.items.filter(i => !i.completed).map(i => `
            <div class="bg-white p-3 rounded-xl border border-slate-100 flex items-center justify-between shadow-sm">
              <div>
                <p class="text-xs font-bold text-slate-800">${i.title}</p>
                <p class="text-[10px] text-slate-400">${i.type} • Due: ${i.dueDate}</p>
              </div>
              <button onclick="markItemComplete('${i.id}')" class="text-[10px] px-2.5 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg font-bold hover:bg-emerald-100 transition">Done</button>
            </div>
          `).join('')}
          ${appData.items.filter(i => !i.completed).length === 0 ? '<div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-200"><p class="text-xs text-slate-400">All caught up! No pending items.</p></div>' : ''}
        </div>
      `;
    }

    // Modal Control
    function openQuickAddModal() { document.getElementById('quickAddModal').classList.remove('hidden'); }
    function closeQuickAddModal(e) { document.getElementById('quickAddModal').classList.add('hidden'); }
    function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

    // Logic: Expenses
    function openExpenseForm() {
      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      const catOptions = Object.keys(appData.categories).map(c => `<option value="${c}">${c}</option>`).join('');

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3">Add Expense</h3>
        <form onsubmit="saveExpense(event)" class="space-y-3">
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Amount (₹)</label>
            <input type="number" required id="expAmount" step="any" class="w-full text-base font-bold p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Category</label>
              <select id="expCategory" onchange="updateSubCategoryDropdown()" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
                ${catOptions}
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Sub-category</label>
              <select id="expSubCategory" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
                <!-- Injected via JS -->
              </select>
            </div>
          </div>

          <div>
            <label class="text-[11px] font-semibold text-slate-400">Date</label>
            <input type="date" required id="expDate" value="${new Date().toISOString().split('T')[0]}" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Description / Note (Optional)</label>
            <input type="text" id="expNote" placeholder="e.g. Lunch, Fuel, Groceries" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeFormModal()" class="flex-1 py-2.5 text-xs border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition">Cancel</button>
            <button type="submit" class="flex-1 py-2.5 text-xs bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">Save Expense</button>
          </div>
        </form>
      `;
      
      updateSubCategoryDropdown();
    }

    function updateSubCategoryDropdown() {
      const cat = document.getElementById('expCategory').value;
      const subSelect = document.getElementById('expSubCategory');
      const subs = appData.categories[cat] || [];
      
      if (subs.length === 0) {
        subSelect.innerHTML = '<option value="">None</option>';
        subSelect.disabled = true;
        subSelect.classList.add('bg-slate-50', 'text-slate-400');
      } else {
        subSelect.innerHTML = '<option value="">-- Select --</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
        subSelect.disabled = false;
        subSelect.classList.remove('bg-slate-50', 'text-slate-400');
      }
    }

    function saveExpense(e) {
      e.preventDefault();
      const newExp = {
        id: 'exp_' + Date.now(),
        amount: parseFloat(document.getElementById('expAmount').value),
        category: document.getElementById('expCategory').value,
        subCategory: document.getElementById('expSubCategory').value || null,
        date: document.getElementById('expDate').value,
        note: document.getElementById('expNote').value
      };
      appData.expenses.push(newExp);
      saveState();
      closeFormModal();
      navigate(currentTab);
    }

    // Logic: Due Items
    function openDueItemForm(defaultType = 'Bill') {
      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3">Add Reminder / Due Item</h3>

    function saveDueItem(e) {

      const newItem = {

        title: document.getElementById('itemTitle').value,
        type: document.getElementById('itemType').value,
        amount: document.getElementById('itemAmount').value ? parseFloat(document.getElementById('itemAmount').value) : null,
        dueDate: document.getElementById('itemDueDate').value,
        recurrence: document.getElementById('itemRecurrence').value,
        completed: false
      };
      appData.items.push(newItem);
      saveState();
      closeFormModal();
      navigate(currentTab);

    function markItemComplete(id) {
      const item = appData.items.find(i => i.id === id);
      if (!item) return;

      if (item.amount && confirm(`Add ₹${item.amount} payment to your Expense Log?`)) {
        appData.expenses.push({
          id: 'exp_' + Date.now(),
          amount: item.amount,
          category: item.type === 'Subscription' ? 'Entertainment' : 'Bills',
          subCategory: item.title,
          date: new Date().toISOString().split('T')[0],
          note: item.title + ' payment'
        });
      }

      if (item.recurrence && item.recurrence !== 'None') {
        const nextDate = new Date(item.dueDate);
        if (item.recurrence === 'Monthly') nextDate.setMonth(nextDate.getMonth() + 1);
        else if (item.recurrence === 'Quarterly') nextDate.setMonth(nextDate.getMonth() + 3);
        else if (item.recurrence === 'Yearly') nextDate.setFullYear(nextDate.getFullYear() + 1);
        item.dueDate = nextDate.toISOString().split('T')[0];
      } else {
        item.completed = true;
      }

      saveState();
      navigate(currentTab);
    }

                 </button>`

    function addRecurringItem(e) {
      e.preventDefault();
      const name = document.getElementById('newRecurringName').value.trim();
      const category = document.getElementById('newRecurringCategory').value;
      const price = parseFloat(document.getElementById('newRecurringPrice').value) || 0;
      if (!name) return;

      appData.recurringItems.push({
        id: 'recur_' + Date.now(),
        name,
        category,
        subCategory: null,
        price
      });
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteRecurringItem(id) {
      if (!confirm('Remove this recurring item? Past logged expenses will NOT be affected — only future calendar toggles.')) return;
      appData.recurringItems = appData.recurringItems.filter(i => i.id !== id);
      if (selectedRecurringItemId === id) selectedRecurringItemId = null;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function addCategory() {
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();
      if (!name) return;
      if (appData.categories[name]) {
        alert('That category already exists.');
        return;
      }
      appData.categories[name] = [];
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteCategory(name) {
      const inUseCount = appData.expenses.filter(e => e.category === name).length;
      const msg = inUseCount > 0
        ? `"${name}" is used on ${inUseCount} existing expense(s). Those will keep showing "${name}" — you just won't be able to pick it for new entries. Delete anyway?`
        : `Delete category "${name}"?`;
      if (!confirm(msg)) return;

      delete appData.categories[name];
      if (selectedCategoryForSub === name) selectedCategoryForSub = null;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function onSubCategoryCategoryChange(name) {
      selectedCategoryForSub = name;
      renderSettings(document.getElementById('mainContainer'));
    }

    function addSubCategory() {
      const catName = selectedCategoryForSub || Object.keys(appData.categories)[0];
      if (!catName) return;

      const input = document.getElementById('newSubCategoryName');
      const sub = input.value.trim();
      if (!sub) return;

      if (!appData.categories[catName]) appData.categories[catName] = [];
      if (appData.categories[catName].includes(sub)) {
        alert('That sub-category already exists.');
        return;
      }

      appData.categories[catName].push(sub);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteSubCategory(catName, sub) {
      const inUseCount = appData.expenses.filter(e => e.category === catName && e.subCategory === sub).length;
      const msg = inUseCount > 0
        ? `"${sub}" is used on ${inUseCount} existing expense(s). Those will keep showing "${sub}" — you just won't be able to pick it for new entries. Delete anyway?`
        : `Delete sub-category "${sub}" from "${catName}"?`;
      if (!confirm(msg)) return;

      appData.categories[catName] = (appData.categories[catName] || []).filter(s => s !== sub);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function saveDriveSettings() {
      const clientId = document.getElementById('settingClientId').value.trim();
      const folderName = document.getElementById('settingFolder').value.trim() || 'Life Tracker Sync';
      
      if (!clientId) return alert('Client ID is required.');
      
      localStorage.setItem(G_CLIENT_ID_KEY, clientId);
      localStorage.setItem(G_FOLDER_KEY, folderName);
      document.getElementById('driveSyncNotice').innerText = 'Configuration saved!';
      document.getElementById('driveSyncNotice').className = 'text-[11px] text-center text-emerald-500 font-medium h-4';
    }

    // --- Google Drive API Logic with Folders ---
    function authenticateGoogleDrive() {
      const clientId = localStorage.getItem(G_CLIENT_ID_KEY);
      if (!clientId) return alert('Please enter and save your Google Cloud OAuth Client ID first.');

      if (typeof google === 'undefined' || !google.accounts) {
        return alert('Google scripts are loading or offline. Check internet connection.');
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (response) => {
          if (response.error) {
            alert('Authentication failed: ' + response.error);
            return;
          }
          gdriveToken = response.access_token;
          
          // Update global header status
          const status = document.getElementById('globalDriveStatus');
          status.innerHTML = '<i class="fa-brands fa-google-drive text-amber-500"></i> Connected';
          status.classList.remove('text-slate-400', 'bg-white');
          status.classList.add('text-slate-700', 'bg-amber-50', 'border-amber-100');

          // Re-render settings if open
          if(currentTab === 'settings') renderSettings(document.getElementById('mainContainer'));
        }
      });
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function disconnectDrive() {
      // Just wipe token from local session memory - no API revoking
      gdriveToken = null;
      
      // Update global header status back to Offline
      const status = document.getElementById('globalDriveStatus');
      status.innerHTML = '<i class="fa-brands fa-google-drive"></i> Offline';
      status.classList.add('text-slate-400', 'bg-white');
      status.classList.remove('text-slate-700', 'bg-amber-50', 'border-amber-100');
      
      // Re-render Settings screen to show Connect button and disable Backup/Restore
      if(currentTab === 'settings') {
        renderSettings(document.getElementById('mainContainer'));
        document.getElementById('driveSyncNotice').innerText = 'Drive disconnected from this session.';
        document.getElementById('driveSyncNotice').className = 'text-[11px] text-center text-slate-500 font-medium h-4';
      }
    }

    // Helper: Find or create the target folder
    async function getOrCreateFolder(folderName) {
      const query = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`;
      const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
        headers: { Authorization: `Bearer ${gdriveToken}` }
      });
      const searchData = await searchRes.json();

      if (searchData.files && searchData.files.length > 0) {
        return searchData.files[0].id;
      }

      const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: { 
          Authorization: `Bearer ${gdriveToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: folderName,
          mimeType: 'application/vnd.google-apps.folder'
        })
      });
      const createData = await createRes.json();
      return createData.id;
    }

    async function backupToGoogleDrive() {
      if (!gdriveToken) return alert('Authenticate with Google first!');
      const notice = document.getElementById('driveSyncNotice');
      notice.innerText = 'Preparing backup...';
      notice.className = 'text-[11px] text-center text-blue-500 font-medium h-4';

      try {
        const folderName = localStorage.getItem(G_FOLDER_KEY) || 'Life Tracker Sync';
        const folderId = await getOrCreateFolder(folderName);
        notice.innerText = `Found folder '${folderName}'... uploading...`;

        const fileName = 'life_tracker_data.json';
        const fileContent = JSON.stringify(appData, null, 2);
        
        const query = `name='${fileName}' and '${folderId}' in parents and trashed=false`;
        const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
          headers: { Authorization: `Bearer ${gdriveToken}` }
        });
        const searchData = await searchRes.json();

        let endpoint = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
        let method = 'POST';
        
        let metadata = { name: fileName, mimeType: 'application/json' };
        
        if (searchData.files && searchData.files.length > 0) {
          const fileId = searchData.files[0].id;
          endpoint = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`;
          method = 'PATCH';
        } else {
          metadata.parents = [folderId];
        }

        const boundary = 'foo_bar_baz';
        const delimiter = "\r\n--" + boundary + "\r\n";
        const closeDelim = "\r\n--" + boundary + "--";
        const multipartRequestBody =
          delimiter +
          'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
          JSON.stringify(metadata) +
          delimiter +
          'Content-Type: application/json\r\n\r\n' +
          fileContent +
          closeDelim;

        const res = await fetch(endpoint, {
          method: method,
          headers: {
            Authorization: `Bearer ${gdriveToken}`,
            'Content-Type': `multipart/related; boundary=${boundary}`
          },
          body: multipartRequestBody
        });

        if (res.ok) {
          notice.innerText = 'Upload successful!';
          notice.className = 'text-[11px] text-center text-emerald-600 font-medium h-4';
        } else {
          throw new Error('Upload failed. API rejected request.');
        }
      } catch (err) {
        console.error(err);
        notice.innerText = 'Error: ' + err.message;
        notice.className = 'text-[11px] text-center text-rose-600 font-medium h-4';
      }
    }

    async function restoreFromGoogleDrive() {
      if (!gdriveToken) return alert('Authenticate with Google first!');
      const notice = document.getElementById('driveSyncNotice');
      notice.innerText = 'Searching Drive...';
      notice.className = 'text-[11px] text-center text-blue-500 font-medium h-4';

      try {
        const folderName = localStorage.getItem(G_FOLDER_KEY) || 'Life Tracker Sync';
        const folderId = await getOrCreateFolder(folderName);

        const query = `name='life_tracker_data.json' and '${folderId}' in parents and trashed=false`;
        const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
          headers: { Authorization: `Bearer ${gdriveToken}` }
        });
        const searchData = await searchRes.json();

        if (!searchData.files || searchData.files.length === 0) {
          notice.innerText = `No backup found in folder '${folderName}'.`;
          notice.className = 'text-[11px] text-center text-rose-600 font-medium h-4';
          return;
        }

        const fileId = searchData.files[0].id;
        const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
          headers: { Authorization: `Bearer ${gdriveToken}` }
        });

        const cloudData = await fileRes.json();
        if (cloudData && Array.isArray(cloudData.expenses)) {
          if (confirm('Are you sure you want to replace your current local data with the version from Google Drive?')) {
            appData = getDefaultAppData();
            mergeIntoAppData(cloudData);
            saveState();
            notice.innerText = 'Data Restored Successfully!';
            notice.className = 'text-[11px] text-center text-emerald-600 font-medium h-4';
            navigate('home');
          }
        }
      } catch (err) {
        console.error(err);
        notice.innerText = 'Restore Error: ' + err.message;
        notice.className = 'text-[11px] text-center text-rose-600 font-medium h-4';
      }
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', initStorage);
