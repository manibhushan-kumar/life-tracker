<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="./life-tracker-logo.png">
  <link rel="apple-touch-icon" href="./life-tracker-logo.png">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24 font-sans select-none">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
        <i class="fa-solid fa-layer-group text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight leading-none text-slate-800">Life Tracker</h1>
        <p class="text-[10px] font-medium text-slate-400 leading-tight mt-0.5" id="headerDate">Loading...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="globalDriveStatus" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold border border-slate-200 text-slate-400 bg-white shadow-sm transition-colors duration-300">
        <i class="fa-brands fa-google-drive"></i> Offline
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-5" id="mainContainer">
    <!-- Dynamic views injected via JS: Home, Expenses, Items, Settings -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-slate-200 max-w-md mx-auto">
    <div class="flex items-center justify-around py-2">
      <button onclick="navigate('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-blue-600 flex-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-semibold">Home</span>
      </button>
      <button onclick="navigate('expenses')" id="nav-expenses" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span class="text-[10px] font-medium">Expenses</span>
      </button>
      
      <!-- Primary FAB (+) -->
      <div class="relative -top-4 flex items-center justify-center flex-1">
        <button onclick="openQuickAddModal()" class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/40 hover:bg-blue-700 active:scale-95 transition">
          <i class="fa-solid fa-plus text-xl"></i>
        </button>
      </div>

      <button onclick="navigate('items')" id="nav-items" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-calendar-check text-lg"></i>
        <span class="text-[10px] font-medium">Due Items</span>
      </button>
      <button onclick="navigate('compare')" id="nav-compare" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-chart-column text-lg"></i>
        <span class="text-[10px] font-medium">Compare</span>
      </button>
      <button onclick="navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] font-medium">Settings</span>
      </button>
    </div>
  </nav>

  <!-- Quick Add Action Sheet Modal -->
  <div id="quickAddModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end justify-center transition-opacity" onclick="closeQuickAddModal(event)">
    <div class="bg-white w-full max-w-md rounded-t-2xl p-5 shadow-2xl space-y-4 transform transition-transform" onclick="event.stopPropagation()">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-2"></div>
      <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Quick Record</h3>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openExpenseForm(); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-emerald-500/10 text-emerald-600 flex items-center justify-center font-bold">₹</div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Expense</p><p class="text-[10px] text-slate-400">Track spending</p></div>
        </button>
        <button onclick="openDueItemForm('Bill'); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-rose-500/10 text-rose-600 flex items-center justify-center"><i class="fa-solid fa-file-invoice-dollar text-sm"></i></div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Bill</p><p class="text-[10px] text-slate-400">Utility, Rent, EMI</p></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Common Generic Form Modal -->
  <div id="formModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="formModalContent" class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <!-- Injected form fields dynamically -->
    </div>
  </div>

  <script src="./js/data-model.js"></script>
  <script src="./js/idb.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/drive-sync.js"></script>
  <script src="./js/compare.js"></script>

  <script>
    // --- Application State ---
    // Data model (getDefaultAppData/mergeIntoAppData/getEffectivePrice/etc),
    // IndexedDB persistence (appData/saveState/initStorage), and Google
    // Drive sync (backupToGoogleDrive/restoreFromGoogleDrive/auth) all live
    // in ./js/*.js now - loaded above, before this block, so everything
    // below can just use them as globals. This block is rendering + event
    // handlers only.

    let currentTab = 'home';
    function navigate(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-slate-400');
      });
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) {
        activeNav.classList.add('text-blue-600');
        activeNav.classList.remove('text-slate-400');
      }

      const container = document.getElementById('mainContainer');
      if (tab === 'home') renderHome(container);
      else if (tab === 'expenses') renderExpenses(container);
      else if (tab === 'compare') renderCompare(container);
      else if (tab === 'items') renderItems(container);
      else if (tab === 'settings') renderSettings(container);
    }

    // --- Home Screen View ---
    // Shared row renderer for an expense line-item, with a delete button, used by
    // both the Home "Recent Spending" preview and the full Expenses tab list so
    // there's one place to change the markup, not two copies drifting apart.
    function renderExpenseRow(e, wrapperClass) {
      return `
        <div class="${wrapperClass} flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p class="text-xs font-bold text-slate-800 truncate">${e.note || e.category}</p>
            <p class="text-[10px] text-slate-400 truncate">${e.category}${e.subCategory ? ' &raquo; ' + e.subCategory : ''} &bull; ${e.date}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <p class="text-xs font-bold text-slate-800">₹${Number(e.amount).toLocaleString()}</p>
            <button onclick="deleteExpense('${e.id}')" class="w-6 h-6 rounded-full flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition" title="Delete expense">
              <i class="fa-solid fa-trash text-[11px]"></i>
            </button>
          </div>
        </div>
      `;
    }

    function deleteExpense(id) {
      const exp = appData.expenses.find(e => e.id === id);
      if (!exp) return;
      if (!confirm(`Delete this expense?\n\n${exp.note || exp.category} \u2022 \u20b9${Number(exp.amount).toLocaleString()} \u2022 ${exp.date}`)) return;

      appData.expenses = appData.expenses.filter(e => e.id !== id);
      saveState();
      navigate(currentTab);
    }

    // Home is a "this year" workspace by design - older years get pulled
    // into IndexedDB purely for the Compare tab (or on request via Restore),
    // not to clutter the day-to-day view. See expensesInYear() in
    // js/data-model.js for the single shared definition of that filter.
    function renderHome(container) {
      const todayStr = getTodayStr();
      const currentMonthStr = todayStr.slice(0, 7); // YYYY-MM
      const yearExpenses = expensesInYear(currentYearStr());
      const todaySpending = yearExpenses.filter(e => e.date === todayStr).reduce((sum, e) => sum + Number(e.amount), 0);
      const monthSpending = yearExpenses.filter(e => e.date.startsWith(currentMonthStr)).reduce((sum, e) => sum + Number(e.amount), 0);
      
      container.innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Spent Today</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">₹${todaySpending.toLocaleString()}</p>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">This Month</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">₹${monthSpending.toLocaleString()}</p>
          </div>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Recent Spending</h3>
          <div class="bg-white rounded-2xl border border-slate-100 divide-y divide-slate-50 overflow-y-auto hide-scrollbar shadow-xs" style="max-height: 420px;">
            ${yearExpenses.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 50).map(e => renderExpenseRow(e, 'p-3')).join('')}
            ${yearExpenses.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">No expenses recorded.</p>' : ''}
          </div>
        </div>
      `;
    }

    // --- Working Expenses & Items Views ---
    let expenseFilterMonth = getTodayStr().slice(0, 7); // YYYY-MM
    let selectedRecurringItemId = null;

    function renderExpenses(container) {
      const currentYear = currentYearStr();
      // Expenses is a "this year" workspace, same as Home - guard against
      // expenseFilterMonth ever drifting outside it (defensive; nothing sets
      // it there today, but the native month picker's fallback UI could).
      if (!expenseFilterMonth.startsWith(currentYear)) {
        expenseFilterMonth = getTodayStr().slice(0, 7);
      }

      const monthExpenses = appData.expenses.filter(e => e.date.startsWith(expenseFilterMonth));
      const monthTotal = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
      const [fYear, fMonth] = expenseFilterMonth.split('-').map(Number);
      const monthLabel = new Date(fYear, fMonth - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const activeItem = appData.recurringItems.find(i => i.id === selectedRecurringItemId) || appData.recurringItems[0] || null;
      // Entries logged via this item's calendar always carry a deterministic
      // `<itemId>_<date>` id, so this only counts that item's own logged days -
      // not unrelated expenses that merely share its category.
      const activeItemMonthTotal = activeItem
        ? monthExpenses.filter(e => e.id.startsWith(activeItem.id + '_')).reduce((sum, e) => sum + Number(e.amount), 0)
        : 0;

      container.innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">All Expenses</h2>
          <button onclick="openExpenseForm()" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm hover:bg-blue-700">+ Add Expense</button>
        </div>

        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-3">
          <div>
            <label class="text-[10px] font-semibold text-slate-400 block mb-1">Filter by Month (${currentYear})</label>
            <input type="month" value="${expenseFilterMonth}" min="${currentYear}-01" max="${currentYear}-12" onchange="onExpenseMonthChange(this.value)" class="text-xs p-2 rounded-lg border border-slate-200 outline-none focus:border-blue-500 bg-white">
          </div>
          <div class="text-right">
            <p class="text-[10px] font-semibold text-slate-400 uppercase">${monthLabel} Total</p>
            <p class="text-lg font-bold text-slate-800">₹${monthTotal.toLocaleString()}</p>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-repeat text-blue-400"></i> Daily Recurring Calendar</h3>
          </div>
          ${appData.recurringItems.length === 0 ? `
            <p class="text-[11px] text-slate-400 text-center py-4">No recurring items yet. Add one (e.g. Milk, Newspaper) in Settings.</p>
          ` : `
            <div class="flex items-center justify-between gap-2 mb-3">
              <select id="recurringItemSelect" onchange="onRecurringItemChange(this.value)" class="flex-1 text-xs p-2 rounded-lg border border-slate-200 outline-none focus:border-blue-500 bg-white">
                ${appData.recurringItems.map(item => `<option value="${item.id}" ${item.id === activeItem.id ? 'selected' : ''}>${item.name}</option>`).join('')}
              </select>
              <span class="text-[10px] text-slate-400 whitespace-nowrap">₹${Number(getEffectivePrice(activeItem)).toLocaleString()}/day today</span>
            </div>
            <div class="bg-blue-50 rounded-xl p-2.5 text-center mb-3">
              <p class="text-[9px] font-semibold text-blue-400 uppercase tracking-wide">This Month</p>
              <p class="text-sm font-bold text-blue-700">₹${activeItemMonthTotal.toLocaleString()}</p>
            </div>
            <div id="recurringCalendarGrid" class="grid grid-cols-7 gap-1.5">
              ${buildRecurringCalendarHtml(activeItem, expenseFilterMonth)}
            </div>
          `}
        </div>

        <div class="space-y-2 mt-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">${monthLabel} Expenses</h3>
          ${monthExpenses.slice().reverse().map(e => renderExpenseRow(e, 'bg-white p-3 rounded-xl border border-slate-100 shadow-sm hover:bg-slate-50 transition')).join('')}
          ${monthExpenses.length === 0 ? '<div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-200"><p class="text-xs text-slate-400">No expenses recorded for this month.</p></div>' : ''}
        </div>
      `;
    }

    function onExpenseMonthChange(value) {
      if (!value) return;
      const currentYear = currentYearStr();
      if (!value.startsWith(currentYear)) {
        alert(`Expenses only shows ${currentYear}. Head to the Compare tab to look at other years, or Restore Data in Settings if ${value.slice(0, 4)} isn't loaded locally.`);
        navigate('expenses');
        return;
      }
      expenseFilterMonth = value;
      navigate('expenses');
    }

    function onRecurringItemChange(id) {
      selectedRecurringItemId = id;
      navigate('expenses');
    }

    function buildRecurringCalendarHtml(item, monthStr) {
      const [year, month] = monthStr.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      let html = '';
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${monthStr}-${String(day).padStart(2, '0')}`;
        const logged = appData.expenses.some(e => e.id === item.id + '_' + dateStr);
        const dayPrice = getEffectivePrice(item, dateStr);
        html += `
          <button onclick="toggleRecurringDay('${item.id}', '${dateStr}')" title="₹${dayPrice}/day on ${dateStr}" class="aspect-square rounded-lg text-[11px] font-bold flex items-center justify-center border transition ${logged ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-blue-50'}">
            ${day}
          </button>
        `;
      }
      return html;
    }

    function toggleRecurringDay(itemId, dateStr) {
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item) return;

      const entryId = itemId + '_' + dateStr;
      const existingIdx = appData.expenses.findIndex(e => e.id === entryId);

      if (existingIdx > -1) {
        appData.expenses.splice(existingIdx, 1);
      } else {
        appData.expenses.push({
          id: entryId,
          amount: getEffectivePrice(item, dateStr),
          category: item.category,
          subCategory: item.subCategory || null,
          date: dateStr,
          note: item.name
        });
      }
      saveState();
      navigate(currentTab);
    }

    // How many days out counts as "near expiry" for due/expiry items.
    const NEAR_EXPIRY_DAYS = 7;

    // Whole days between today and a YYYY-MM-DD due date (negative = already past).
    function daysUntil(dueDateStr) {
      const today = new Date(getTodayStr() + 'T00:00:00');
      const due = new Date(dueDateStr + 'T00:00:00');
      return Math.round((due - today) / 86400000);
    }

    function getItemUrgency(dueDateStr) {
      const diff = daysUntil(dueDateStr);
      if (diff < 0) return 'expired';
      if (diff <= NEAR_EXPIRY_DAYS) return 'soon';
      return 'ok';
    }

    function urgencyBadge(urgency) {
      if (urgency === 'expired') return '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-600">EXPIRED</span>';
      if (urgency === 'soon') return '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-600">DUE SOON</span>';
      return '';
    }

    function renderItems(container) {
      container.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-sm font-bold text-slate-800">Due & Expiry Tracking</h2>
          <div class="flex gap-2">
            <button onclick="checkExpiryStatus()" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg font-semibold hover:bg-amber-100 transition"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Check</button>
            <button onclick="openDueItemForm('Bill')" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm hover:bg-blue-700">+ Add Item</button>
          </div>
        </div>
        <div class="space-y-2 mt-3">
          ${appData.items.filter(i => !i.completed).map(i => {
            const urgency = getItemUrgency(i.dueDate);
            const borderClass = urgency === 'expired' ? 'border-rose-200' : urgency === 'soon' ? 'border-amber-200' : 'border-slate-100';
            return `
              <div class="bg-white p-3 rounded-xl border ${borderClass} flex items-center justify-between shadow-sm">
                <div>
                  <div class="flex items-center gap-1.5">
                    <p class="text-xs font-bold text-slate-800">${i.title}</p>
                    ${urgencyBadge(urgency)}
                  </div>
                  <p class="text-[10px] text-slate-400">${i.type} • Due: ${i.dueDate}</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button onclick="markItemComplete('${i.id}')" class="text-[10px] px-2.5 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg font-bold hover:bg-emerald-100 transition">Done</button>
                  <button onclick="deleteDueItem('${i.id}')" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition" title="Delete"><i class="fa-solid fa-trash text-[11px]"></i></button>
                </div>
              </div>
            `;
          }).join('')}
          ${appData.items.filter(i => !i.completed).length === 0 ? '<div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-200"><p class="text-xs text-slate-400">All caught up! No pending items.</p></div>' : ''}
        </div>
      `;
    }

    // Opens the shared form modal as a report of everything expired or due
    // within NEAR_EXPIRY_DAYS - a quick "anything I need to worry about?" check.
    function checkExpiryStatus() {
      const pending = appData.items.filter(i => !i.completed);
      const expired = pending.filter(i => getItemUrgency(i.dueDate) === 'expired');
      const soon = pending.filter(i => getItemUrgency(i.dueDate) === 'soon');

      const renderGroup = (title, colorClass, list) => list.length === 0 ? '' : `
        <div class="space-y-1.5">
          <p class="text-[10px] font-bold uppercase tracking-wide ${colorClass}">${title} (${list.length})</p>
          ${list.map(i => `
            <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
              <div>
                <p class="text-xs font-bold text-slate-800">${i.title}</p>
                <p class="text-[10px] text-slate-400">${i.type} &bull; Due: ${i.dueDate}</p>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="closeFormModal(); markItemComplete('${i.id}')" class="text-[10px] px-2 py-1 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg font-bold hover:bg-emerald-100 transition">Done</button>
                <button onclick="deleteDueItem('${i.id}'); checkExpiryStatus();" class="w-6 h-6 rounded-lg flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition" title="Delete"><i class="fa-solid fa-trash text-[10px]"></i></button>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3"><i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>Expiry Check</h3>
        <div class="space-y-3 max-h-[60vh] overflow-y-auto">
          ${expired.length === 0 && soon.length === 0
            ? '<p class="text-xs text-slate-400 text-center py-6">All clear! Nothing expired or due within ' + NEAR_EXPIRY_DAYS + ' days.</p>'
            : renderGroup('Already Expired', 'text-rose-600', expired) + renderGroup('Due Within ' + NEAR_EXPIRY_DAYS + ' Days', 'text-amber-600', soon)
          }
        </div>
        <button onclick="closeFormModal()" class="w-full mt-4 py-2.5 text-xs border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition">Close</button>
      `;
    }

    // Modal Control
    function openQuickAddModal() { document.getElementById('quickAddModal').classList.remove('hidden'); }
    function closeQuickAddModal(e) { document.getElementById('quickAddModal').classList.add('hidden'); }
    function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

    // Logic: Expenses
    function openExpenseForm() {
      const modal = document.getElementById('formModal');

    function markItemComplete(id) {
      const item = appData.items.find(i => i.id === id);
      if (!item) return;

      if (item.amount && confirm(`Add ₹${item.amount} payment to your Expense Log?`)) {
        appData.expenses.push({
          id: 'exp_' + Date.now(),
          amount: item.amount,
          category: item.type === 'Subscription' ? 'Entertainment' : 'Bills',
          subCategory: item.title,
          date: getTodayStr(),
          note: item.title + ' payment'
        });
      }

      if (item.recurrence && item.recurrence !== 'None') {
        const nextDate = new Date(item.dueDate);
        if (item.recurrence === 'Monthly') nextDate.setMonth(nextDate.getMonth() + 1);
        else if (item.recurrence === 'Quarterly') nextDate.setMonth(nextDate.getMonth() + 3);
        else if (item.recurrence === 'Yearly') nextDate.setFullYear(nextDate.getFullYear() + 1);
        item.dueDate = formatDateLocal(nextDate);
      } else {
        item.completed = true;
      }

      saveState();
      navigate(currentTab);
    }

    function deleteDueItem(id) {
      const item = appData.items.find(i => i.id === id);
      if (!item) return;
      if (!confirm(`Delete "${item.title}"? It'll be removed from Due & Expiry Tracking entirely. Any expenses already logged from it in the past are NOT affected.`)) return;

      appData.items = appData.items.filter(i => i.id !== id);
      saveState();
      navigate(currentTab);
    }

    function clearAllExpenses() {
      if (appData.expenses.length === 0) {
        alert('There are no expenses to clear.');
        return;
      }
      const confirmed = confirm(`This will permanently delete all ${appData.expenses.length} logged expense(s). Categories, sub-categories, recurring items, and due items will NOT be affected. This cannot be undone. Continue?`);
      if (!confirmed) return;

      appData.expenses = [];
      saveState();
      renderSettings(document.getElementById('mainContainer'));
      alert('All expenses cleared.');
    }

    // Frees up local space by dropping one year's worth of expenses from
    // IndexedDB. Deliberately does NOT touch Google Drive (see
    // deleteYearDataLocally() in js/storage.js) - Restore Data can always
    // bring the year back down later. The current year is off-limits here
    // (enforced both in the list above AND inside deleteYearDataLocally
    // itself) since Home/Expenses depend on it always being present.
    async function deleteYearDataFromSettings(year) {
      if (year === currentYearStr()) {
        alert(`${year} is the active year and can't be deleted here - Home and Expenses need it. Use "Clear All Expenses" in the Danger Zone below if you really want to wipe everything.`);
        return;
      }

      const count = expensesInYear(year).length;
      if (!confirm(`Remove ${count} expense(s) for ${year} from this device?\n\nYour Drive backup keeps the full history untouched - use Restore Data any time to bring ${year} back.`)) return;

      try {
        await deleteYearDataLocally(year);
      } catch (err) {
        alert(err.message);
        return;
      }
      renderSettings(document.getElementById('mainContainer'));
    }

    function addRecurringItem(e) {
      e.preventDefault();
      const name = document.getElementById('newRecurringName').value.trim();
      const category = document.getElementById('newRecurringCategory').value;
      const price = parseFloat(document.getElementById('newRecurringPrice').value) || 0;
      if (!name) return;

      appData.recurringItems.push({
        id: 'recur_' + Date.now(),
        name,
        category,
        subCategory: null,
        price,
        priceHistory: [{ from: getTodayStr(), price }]
      });
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteRecurringItem(id) {
      if (!confirm('Remove this recurring item? Past logged expenses will NOT be affected — only future calendar toggles.')) return;
      appData.recurringItems = appData.recurringItems.filter(i => i.id !== id);
      if (selectedRecurringItemId === id) selectedRecurringItemId = null;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3">Change Price: ${item.name}</h3>
        <form onsubmit="savePriceChange(event, '${itemId}')" class="space-y-3">
          <div>
            <label class="text-[11px] font-semibold text-slate-400">New Price per Day (₹)</label>
            <input type="number" required id="priceChangeAmount" step="any" value="${getEffectivePrice(item)}" class="w-full text-base font-bold p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Effective From</label>
            <input type="date" required id="priceChangeDate" value="${getTodayStr()}" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
            <p class="text-[9px] text-slate-400 mt-1">Days before this date keep the old price. Expenses already logged never change.</p>
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeFormModal()" class="flex-1 py-2.5 text-xs border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition">Cancel</button>
            <button type="submit" class="flex-1 py-2.5 text-xs bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">Save</button>
          </div>
        </form>
      `;
    }

    function savePriceChange(e, itemId) {
      e.preventDefault();
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item) return;

      const price = parseFloat(document.getElementById('priceChangeAmount').value);
      const from = document.getElementById('priceChangeDate').value;
      if (isNaN(price) || !from) return;

      if (!Array.isArray(item.priceHistory) || item.priceHistory.length === 0) {
        item.priceHistory = [{ from: '1970-01-01', price: Number(item.price) || 0 }];
      }

      // Replace a change already scheduled for that exact date, else append a new one.
      const existingIdx = item.priceHistory.findIndex(h => h.from === from);
      if (existingIdx > -1) {
        item.priceHistory[existingIdx].price = price;
      } else {
        item.priceHistory.push({ from, price });
      }
      item.priceHistory.sort((a, b) => a.from.localeCompare(b.from));
      item.price = getEffectivePrice(item); // keep the cached "today" price in sync

      saveState();
      closeFormModal();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deletePriceChange(itemId, from) {
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item || !Array.isArray(item.priceHistory) || item.priceHistory.length <= 1) return;

      const entry = item.priceHistory.find(h => h.from === from);
      if (!entry) return;
      if (!confirm(`Remove the ₹${entry.price} price change effective ${from}?`)) return;

      item.priceHistory = item.priceHistory.filter(h => h.from !== from);
      item.price = getEffectivePrice(item);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function addCategory() {
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();
      if (!name) return;
      if (appData.categories[name]) {
        alert('That category already exists.');
        return;
      }
      appData.categories[name] = [];
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteCategory(name) {
      const inUseCount = appData.expenses.filter(e => e.category === name).length;
      const msg = inUseCount > 0
        ? `"${name}" is used on ${inUseCount} existing expense(s). Those will keep showing "${name}" — you just won't be able to pick it for new entries. Delete anyway?`
        : `Delete category "${name}"?`;
      if (!confirm(msg)) return;

      delete appData.categories[name];
      if (selectedCategoryForSub === name) selectedCategoryForSub = null;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function onSubCategoryCategoryChange(name) {
      selectedCategoryForSub = name;
      renderSettings(document.getElementById('mainContainer'));
    }

    function addSubCategory() {
      const catName = selectedCategoryForSub || Object.keys(appData.categories)[0];
      if (!catName) return;

      const input = document.getElementById('newSubCategoryName');
      const sub = input.value.trim();
      if (!sub) return;

      if (!appData.categories[catName]) appData.categories[catName] = [];
      if (appData.categories[catName].includes(sub)) {
        alert('That sub-category already exists.');
        return;
      }

      appData.categories[catName].push(sub);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteSubCategory(catName, sub) {
      const inUseCount = appData.expenses.filter(e => e.category === catName && e.subCategory === sub).length;
      const msg = inUseCount > 0
        ? `"${sub}" is used on ${inUseCount} existing expense(s). Those will keep showing "${sub}" — you just won't be able to pick it for new entries. Delete anyway?`
        : `Delete sub-category "${sub}" from "${catName}"?`;
      if (!confirm(msg)) return;

      appData.categories[catName] = (appData.categories[catName] || []).filter(s => s !== sub);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }


    // Initialize
    window.addEventListener('DOMContentLoaded', initStorage);

    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
