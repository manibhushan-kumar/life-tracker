<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Kills the browser's native pull-to-refresh gesture. Without this, a
       simple overscroll bounce at the top of ANY tab (not even a deliberate
       "refresh" swipe) triggers a full page reload - which wipes every bit
       of in-memory JS state (currentTab, open modals, everything) and
       re-boots the app straight back to Home. This is the primary fix for
       that; see also the currentTab persistence in navigate()/initStorage()
       as a backstop for the rare reload that still happens some other way
       (e.g. the OS reclaiming memory and relaunching the PWA). -->
    html, body { overscroll-behavior-y: contain; }
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-24 font-sans select-none">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <button onclick="openSideNav()" aria-label="Open menu" class="w-8 h-8 -ml-1 rounded-lg flex items-center justify-center text-slate-500 hover:bg-slate-100 transition">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
        <i class="fa-solid fa-layer-group text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight leading-none text-slate-800">
          <button type="button" onclick="navigate('home')" class="hover:text-blue-600 transition" aria-label="Go to Home">Life Tracker</button><span id="appHeaderCrumb" class="text-slate-400 font-semibold"></span>
        </h1>
        <p class="text-[10px] font-medium text-slate-400 leading-tight mt-0.5" id="headerDate">Loading...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- Only shown once Drive is actually connected (see setDriveConnectedUI
           in drive-sync.js) - lets you push a quick backup from WHEREVER you
           are in the app (Home, Expenses, mid-Splitwise, etc) instead of
           always having to detour through Settings first. Settings keeps its
           own Backup/Restore buttons too - this is an ADDITIONAL shortcut,
           not a replacement (Restore still lives in Settings only, since it
           opens the year-picker modal and is a much more deliberate action). -->
      <button id="globalDriveSyncBtn" onclick="backupToGoogleDrive()" aria-label="Sync to Google Drive" title="Sync to Google Drive" class="hidden w-7 h-7 rounded-full flex items-center justify-center text-blue-600 bg-blue-50 border border-blue-100 hover:bg-blue-100 transition disabled:opacity-50">
        <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
      </button>
      <span id="globalDriveStatus" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold border border-slate-200 text-slate-400 bg-white shadow-sm transition-colors duration-300">
        <i class="fa-brands fa-google-drive"></i> Offline
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-5" id="mainContainer">
    <!-- Dynamic views injected via JS: Home, Expenses, Items, Settings -->
  </main>

  <!-- Bottom Navigation -->
  <!-- Exactly 2 nav-btns on each side of the spacer (Home/Expenses | Due
       Items/Compare) - Settings moved to the side drawer specifically so
       this split stays even. With an uneven 2-vs-3 split (Settings
       included), the single spacer only buffered the LEFT of the FAB,
       leaving Due Items crammed right up against it on the right -
       symmetric counts is what actually fixes that. -->
  <!-- `fixed` alone already gives the FAB below a valid positioning anchor
       (any position value other than `static` establishes a containing
       block for absolutely-positioned descendants) - do NOT also add
       `relative` here. Tailwind's generated stylesheet orders position
       utilities as static/fixed/absolute/relative/sticky, so `relative`
       comes AFTER `fixed` in the actual CSS and silently wins the cascade,
       flipping this whole bar from `position: fixed` to `position: relative`
       and un-pinning it from the bottom of the screen. Learned that one
       the hard way - if this ever needs adjusting again, `fixed` is doing
       double duty as both "pinned to viewport" AND "FAB's anchor", on purpose. -->
  <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-lg border-t border-slate-200 max-w-md mx-auto">
    <div class="flex items-center justify-around py-2">
      <button onclick="navigate('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-blue-600 flex-1">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-semibold">Home</span>
      </button>
      <button onclick="navigate('expenses')" id="nav-expenses" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-wallet text-lg"></i>
        <span class="text-[10px] font-medium">Expenses</span>
      </button>

      <!-- Empty spacer the same width as a nav-btn. Being the exact MIDDLE
           item of an odd total (5 = 2 + spacer + 2) is what puts it dead
           center - same trick as before, just with matching counts now. -->
      <div class="flex-1" aria-hidden="true"></div>

      <button onclick="navigate('items')" id="nav-items" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-calendar-check text-lg"></i>
        <span class="text-[10px] font-medium">Due Items</span>
      </button>
      <button onclick="navigate('compare')" id="nav-compare" class="nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1">
        <i class="fa-solid fa-chart-column text-lg"></i>
        <span class="text-[10px] font-medium">Compare</span>
      </button>
    </div>

    <!-- Primary FAB (+) - deliberately OUTSIDE the flex row above and
         centered against the nav's full width via absolute positioning.
         Doubles as the one home for "add more record types later" (the
         quick-add sheet it opens is already a menu, not a single action). -->
    <button onclick="openQuickAddModal()" aria-label="Quick add" class="absolute left-1/2 -translate-x-1/2 -top-5 w-14 h-14 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/40 border-4 border-white hover:bg-blue-700 active:scale-95 transition">
      <i class="fa-solid fa-plus text-xl"></i>
    </button>
  </nav>

  <!-- Side Nav (collapsible) - currently just houses Settings, kept out of
       the bottom bar specifically so that bar stays an even 2-and-2 split
       around the FAB. Room to add more items here later without ever having
       to rebalance the bottom nav again. -->
  <div id="sideNavBackdrop" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden transition-opacity" onclick="closeSideNav()"></div>
  <aside id="sideNav" class="fixed top-0 left-0 bottom-0 z-50 w-64 bg-white shadow-2xl -translate-x-full transition-transform duration-200 flex flex-col">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
          <i class="fa-solid fa-layer-group text-sm"></i>
        </div>
        <h2 class="text-sm font-bold text-slate-800">Life Tracker</h2>
      </div>
      <button onclick="closeSideNav()" aria-label="Close menu" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <nav class="p-2 space-y-1">
      <button onclick="navigate('settings'); closeSideNav()" id="nav-settings" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-50 transition text-left">
        <i class="fa-solid fa-gear text-base w-5"></i>
        <span class="text-xs font-semibold">Settings</span>
      </button>
    </nav>
  </aside>

  <!-- Quick Add Action Sheet Modal -->
  <div id="quickAddModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end justify-center transition-opacity" onclick="closeQuickAddModal(event)">
    <div class="bg-white w-full max-w-md rounded-t-2xl p-5 shadow-2xl space-y-4 transform transition-transform" onclick="event.stopPropagation()">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-2"></div>
      <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Quick Record</h3>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openExpenseForm(); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-emerald-500/10 text-emerald-600 flex items-center justify-center font-bold">₹</div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Expense</p><p class="text-[10px] text-slate-400">Track spending</p></div>
        </button>
        <button onclick="openDueItemForm('Bill'); closeQuickAddModal()" class="p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
          <div class="w-9 h-9 rounded-lg bg-rose-500/10 text-rose-600 flex items-center justify-center"><i class="fa-solid fa-file-invoice-dollar text-sm"></i></div>
          <div class="text-left"><p class="text-xs font-bold text-slate-800">Bill</p><p class="text-[10px] text-slate-400">Utility, Rent, EMI</p></div>
        </button>
      </div>
      <button onclick="openSplitwise(); closeQuickAddModal()" class="w-full p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
        <div class="w-9 h-9 rounded-lg bg-violet-500/10 text-violet-600 flex items-center justify-center"><i class="fa-solid fa-people-group text-sm"></i></div>
        <div class="text-left"><p class="text-xs font-bold text-slate-800">Splitwise</p><p class="text-[10px] text-slate-400">Split a bill with friends - local only</p></div>
      </button>
      <button onclick="navigate('reports'); closeQuickAddModal()" class="w-full p-3.5 rounded-xl border border-slate-100 bg-slate-50 hover:bg-blue-50 flex items-center gap-3 transition">
        <div class="w-9 h-9 rounded-lg bg-amber-500/10 text-amber-600 flex items-center justify-center"><i class="fa-solid fa-chart-pie text-sm"></i></div>
        <div class="text-left"><p class="text-xs font-bold text-slate-800">Reports</p><p class="text-[10px] text-slate-400">See spending under a tag, e.g. Trip-Goa</p></div>
      </button>
    </div>
  </div>

  <!-- Common Generic Form Modal -->
  <div id="formModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="formModalContent" class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <!-- Injected form fields dynamically -->
    </div>
  </div>

  <!-- Splitwise: a full page, not a bottom-nav tab (it has its own nested
       list -> detail navigation) - but it deliberately does NOT cover the
       real app header/nav like a true full-screen overlay would. Its
       top/bottom get set inline via JS (see _positionSplitwiseOverlay in
       splitwise.js) to exactly match the real header/nav's rendered height,
       measured at runtime rather than guessed/hardcoded - so the standard
       header (branding, Drive status) and bottom nav (so you can jump
       straight to another tab) stay visible and usable the whole time
       you're in here. z-20 keeps it under the header (z-30) and nav (z-40)
       so it can never accidentally paint over either even if a measurement
       is slightly off, and under formModal (z-50, used above for its New
       Group / Add Person / Add Expense forms) so those still show on top
       of it correctly. -->
  <div id="splitwiseOverlay" class="fixed left-0 right-0 z-20 bg-slate-50 hidden flex flex-col overflow-hidden">
    <!-- No standalone "close" (X) button here anymore - the main header's
         "Life Tracker" breadcrumb root (tap it -> navigate('home')) and the
         bottom nav itself both already exit Splitwise via navigate(), which
         closes this overlay as a side effect. One less redundant control. -->
    <!-- Hidden entirely in the group-LIST view (see renderSplitwiseGroupList
         in splitwise.js) since it'd otherwise just show "Splitwise" again,
         right underneath the main header's "Life Tracker / Splitwise"
         breadcrumb - pure duplication with nothing else useful in it (no
         back button either, at the list level). Only shown in group DETAIL
         view, where it earns its keep: back button + the specific group's
         name, neither of which the main header knows about. `hidden` +
         `flex` coexist as static classes (same pattern as #splitwiseOverlay
         itself) with only `hidden` ever toggled at runtime - Tailwind's
         generated stylesheet orders `hidden` after `flex`, so `display:
         none` always wins the cascade while present, and simply removing
         it cleanly falls back to the already-there `flex`. -->
    <div id="splitwiseSubHeader" class="hidden flex sticky top-0 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 items-center gap-2">
      <button id="splitwiseBackBtn" onclick="backToGroupList()" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:bg-slate-100 transition" aria-label="Back to groups">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 id="splitwiseTitle" class="text-sm font-bold text-slate-800"></h2>
    </div>
    <div id="splitwiseContent" class="flex-1 overflow-y-auto p-4 space-y-3 max-w-md mx-auto w-full"></div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/data-model.js"></script>
  <script src="./js/idb.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/drive-sync.js"></script>
  <script src="./js/compare.js"></script>
  <script src="./js/splitwise.js"></script>

  <script>
    // --- Application State ---
    // Data model (getDefaultAppData/mergeIntoAppData/getEffectivePrice/etc),
    // IndexedDB persistence (appData/saveState/initStorage), and Google
    // Drive sync (backupToGoogleDrive/restoreFromGoogleDrive/auth) all live
    // in ./js/*.js now - loaded above, before this block, so everything
    // below can just use them as globals. This block is rendering + event
    // handlers only.

    let currentTab = 'home';
    // Backstop for the overscroll-behavior fix above: if a reload DOES
    // happen despite it (e.g. the OS itself killed and relaunched the PWA,
    // or a manual hard refresh), this is what lets initStorage() resume on
    // whatever tab the user was actually looking at instead of always
    // snapping back to Home. LAST_TAB_STORAGE_KEY lives in data-model.js so
    // this and initStorage() in storage.js always agree on the key name.
    function navigate(tab) {
      // Splitwise is a full page too now (not a bottom-nav tab, but it does
      // share the header/nav), so picking any real tab while it's open has
      // to close it first - otherwise its opaque content area would just
      // sit there covering up whatever this call renders underneath.
      const splitwiseOverlay = document.getElementById('splitwiseOverlay');
      if (splitwiseOverlay && !splitwiseOverlay.classList.contains('hidden')) {
        closeSplitwise();
      }

      currentTab = tab;
      localStorage.setItem(LAST_TAB_STORAGE_KEY, tab);
      setAppHeaderCrumb(TAB_DISPLAY_NAMES[tab]);
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-blue-600');
        btn.classList.add('text-slate-400');
      });
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) {
        activeNav.classList.add('text-blue-600');
        activeNav.classList.remove('text-slate-400');
      }

      const container = document.getElementById('mainContainer');
      if (tab === 'home') renderHome(container);
      else if (tab === 'expenses') renderExpenses(container);
      else if (tab === 'compare') renderCompare(container);
      else if (tab === 'items') renderItems(container);
      else if (tab === 'settings') renderSettings(container);
      else if (tab === 'reports') renderReports(container);
    }

    // --- Home Screen View ---
    // Shared row renderer for an expense line-item, with a delete button, used by
    // both the Home "Recent Spending" preview and the full Expenses tab list so
    // there's one place to change the markup, not two copies drifting apart.
    function renderExpenseRow(e, wrapperClass) {
      return `
        <div class="${wrapperClass} flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p class="text-xs font-bold text-slate-800 truncate">${e.note || e.category}</p>
            <p class="text-[10px] text-slate-400 truncate">${e.category}${e.subCategory ? ' &raquo; ' + e.subCategory : ''} &bull; ${e.date}${e.paidBy ? ' &bull; Paid by ' + getFamilyMemberName(e.paidBy) : ''}${e.tag ? ' &bull; <i class=\'fa-solid fa-tag\'></i> ' + getTagName(e.tag) : ''}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <p class="text-xs font-bold text-slate-800">₹${Number(e.amount).toLocaleString()}</p>
            <button onclick="deleteExpense('${e.id}')" class="w-6 h-6 rounded-full flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition" title="Delete expense">
              <i class="fa-solid fa-trash text-[11px]"></i>
            </button>
          </div>
        </div>
      `;
    }

    function deleteExpense(id) {
      const exp = appData.expenses.find(e => e.id === id);
      if (!exp) return;
      if (!confirm(`Delete this expense?\n\n${exp.note || exp.category} \u2022 \u20b9${Number(exp.amount).toLocaleString()} \u2022 ${exp.date}`)) return;

      appData.expenses = appData.expenses.filter(e => e.id !== id);
      saveState();
      navigate(currentTab);
    }

    // Renders Home's color-coded monthly budget progress bar. Pulled out of
    // renderHome so the color-coding thresholds (see getBudgetStatus in
    // js/data-model.js) and the "no budget configured yet" empty state both
    // live in exactly one place.
    function buildBudgetBarHtml(monthSpending, currentMonthStr) {
      const budget = getBudgetForMonth(currentMonthStr);
      if (budget <= 0) {
        return `
          <div class="bg-white p-3 rounded-2xl border border-dashed border-slate-200 flex items-center justify-between gap-3">
            <p class="text-[11px] text-slate-400"><i class="fa-solid fa-wallet mr-1"></i> No monthly budget set yet.</p>
            <button onclick="navigate('settings')" class="text-[11px] font-semibold text-blue-600 hover:text-blue-700 whitespace-nowrap">Set Budget &rarr;</button>
          </div>
        `;
      }

      const percent = (monthSpending / budget) * 100;
      const status = getBudgetStatus(percent);
      const barWidth = Math.min(100, percent);

      return `
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Monthly Budget</p>
            <span class="text-[10px] font-bold ${status.text}">${status.label} &bull; ${Math.round(percent)}%</span>
          </div>
          <div class="w-full h-2.5 rounded-full ${status.track} overflow-hidden">
            <div class="h-full ${status.bar} rounded-full transition-all" style="width: ${barWidth}%"></div>
          </div>
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-slate-500">₹${monthSpending.toLocaleString()} spent</span>
            <span class="text-slate-400">of ₹${budget.toLocaleString()}</span>
          </div>
        </div>
      `;
    }

    // Home is a "this year" workspace by design - older years get pulled
    // into IndexedDB purely for the Compare tab (or on request via Restore),
    // not to clutter the day-to-day view. See expensesInYear() in
    // js/data-model.js for the single shared definition of that filter.
    function renderHome(container) {
      const todayStr = getTodayStr();
      const currentMonthStr = todayStr.slice(0, 7); // YYYY-MM
      const yearExpenses = expensesInYear(currentYearStr());
      const todaySpending = yearExpenses.filter(e => e.date === todayStr).reduce((sum, e) => sum + Number(e.amount), 0);
      const monthSpending = yearExpenses.filter(e => e.date.startsWith(currentMonthStr)).reduce((sum, e) => sum + Number(e.amount), 0);
      
      container.innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Spent Today</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">₹${todaySpending.toLocaleString()}</p>
          </div>
          <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
            <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">This Month</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">₹${monthSpending.toLocaleString()}</p>
          </div>
        </div>

        ${buildBudgetBarHtml(monthSpending, currentMonthStr)}

        <div class="space-y-2">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Recent Spending</h3>
          <div class="bg-white rounded-2xl border border-slate-100 divide-y divide-slate-50 overflow-y-auto hide-scrollbar shadow-xs" style="max-height: 420px;">
            ${yearExpenses.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 50).map(e => renderExpenseRow(e, 'p-3')).join('')}
            ${yearExpenses.length === 0 ? '<p class="text-xs text-slate-400 text-center py-4">No expenses recorded.</p>' : ''}
          </div>
        </div>
      `;
    }

    // --- Working Expenses & Items Views ---
    let expenseFilterMonth = getTodayStr().slice(0, 7); // YYYY-MM
    let selectedRecurringItemId = null;

    function renderExpenses(container) {
      const currentYear = currentYearStr();
      // Expenses is a "this year" workspace, same as Home - guard against
      // expenseFilterMonth ever drifting outside it (defensive; nothing sets
      // it there today, but the native month picker's fallback UI could).
      if (!expenseFilterMonth.startsWith(currentYear)) {
        expenseFilterMonth = getTodayStr().slice(0, 7);
      }

      const monthExpenses = appData.expenses.filter(e => e.date.startsWith(expenseFilterMonth));
      const monthTotal = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
      const [fYear, fMonth] = expenseFilterMonth.split('-').map(Number);
      const monthLabel = new Date(fYear, fMonth - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const activeItem = appData.recurringItems.find(i => i.id === selectedRecurringItemId) || appData.recurringItems[0] || null;
      // Entries logged via this item's calendar always carry a deterministic
      // `<itemId>_<date>` id, so this only counts that item's own logged days -
      // not unrelated expenses that merely share its category.
      const activeItemMonthTotal = activeItem
        ? monthExpenses.filter(e => e.id.startsWith(activeItem.id + '_')).reduce((sum, e) => sum + Number(e.amount), 0)
        : 0;

      container.innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">All Expenses</h2>
          <button onclick="openExpenseForm()" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm hover:bg-blue-700">+ Add Expense</button>
        </div>

        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-3">
          <div>
            <label class="text-[10px] font-semibold text-slate-400 block mb-1">Filter by Month (${currentYear})</label>
            <input type="month" value="${expenseFilterMonth}" min="${currentYear}-01" max="${currentYear}-12" onchange="onExpenseMonthChange(this.value)" class="text-xs p-2 rounded-lg border border-slate-200 outline-none focus:border-blue-500 bg-white">
          </div>
          <div class="text-right">
            <p class="text-[10px] font-semibold text-slate-400 uppercase">${monthLabel} Total</p>
            <p class="text-lg font-bold text-slate-800">₹${monthTotal.toLocaleString()}</p>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-repeat text-blue-400"></i> Daily Recurring Calendar</h3>
          </div>
          ${appData.recurringItems.length === 0 ? `
            <p class="text-[11px] text-slate-400 text-center py-4">No recurring items yet. Add one (e.g. Milk, Newspaper) in Settings.</p>
          ` : `
            <div class="flex items-center justify-between gap-2 mb-3">
              <select id="recurringItemSelect" onchange="onRecurringItemChange(this.value)" class="flex-1 text-xs p-2 rounded-lg border border-slate-200 outline-none focus:border-blue-500 bg-white">
                ${appData.recurringItems.map(item => `<option value="${item.id}" ${item.id === activeItem.id ? 'selected' : ''}>${item.name}</option>`).join('')}
              </select>
              <span class="text-[10px] text-slate-400 whitespace-nowrap">₹${Number(getEffectivePrice(activeItem)).toLocaleString()}/day today</span>
            </div>
            <div class="bg-blue-50 rounded-xl p-2.5 text-center mb-3">
              <p class="text-[9px] font-semibold text-blue-400 uppercase tracking-wide">This Month</p>
              <p class="text-sm font-bold text-blue-700">₹${activeItemMonthTotal.toLocaleString()}</p>
            </div>
            <div id="recurringCalendarGrid" class="grid grid-cols-7 gap-1.5">
              ${buildRecurringCalendarHtml(activeItem, expenseFilterMonth)}
            </div>
          `}
        </div>

        <div class="space-y-2 mt-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">${monthLabel} Expenses</h3>
          <!-- Sorted by date (newest first), NOT insertion order - a backdated manual
               entry or an out-of-order calendar tap must never scramble the list. -->
          ${monthExpenses.slice().sort((a, b) => b.date.localeCompare(a.date)).map(e => renderExpenseRow(e, 'bg-white p-3 rounded-xl border border-slate-100 shadow-sm hover:bg-slate-50 transition')).join('')}
          ${monthExpenses.length === 0 ? '<div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-200"><p class="text-xs text-slate-400">No expenses recorded for this month.</p></div>' : ''}
        </div>
      `;
    }

    function onExpenseMonthChange(value) {
      if (!value) return;
      const currentYear = currentYearStr();
      if (!value.startsWith(currentYear)) {
        alert(`Expenses only shows ${currentYear}. Head to the Compare tab to look at other years, or Restore Data in Settings if ${value.slice(0, 4)} isn't loaded locally.`);
        navigate('expenses');
        return;
      }
      expenseFilterMonth = value;
      navigate('expenses');
    }

    function onRecurringItemChange(id) {
      selectedRecurringItemId = id;
      navigate('expenses');
    }

    function buildRecurringCalendarHtml(item, monthStr) {
      const [year, month] = monthStr.split('-').map(Number);
      const daysInMonth = new Date(year, month, 0).getDate();
      const startDate = getItemStartDate(item);
      let html = '';
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${monthStr}-${String(day).padStart(2, '0')}`;
        // Item didn't exist yet on this day - show it as a non-interactive
        // blank cell instead of a clickable button. Keeps the calendar grid
        // aligned while making it obvious those days are simply off-limits.
        if (dateStr < startDate) {
          html += `
            <div title="${item.name} was added on ${startDate} - nothing to log before that" class="aspect-square rounded-lg text-[11px] font-bold flex items-center justify-center border border-dashed border-slate-100 text-slate-300 bg-slate-50/50 cursor-not-allowed">
              ${day}
            </div>
          `;
          continue;
        }
        const logged = appData.expenses.some(e => e.id === item.id + '_' + dateStr);
        const dayPrice = getEffectivePrice(item, dateStr);
        html += `
          <button onclick="toggleRecurringDay('${item.id}', '${dateStr}')" title="₹${dayPrice}/day on ${dateStr}" class="aspect-square rounded-lg text-[11px] font-bold flex items-center justify-center border transition ${logged ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-blue-50'}">
            ${day}
          </button>
        `;
      }
      return html;
    }

    function toggleRecurringDay(itemId, dateStr) {
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item) return;

      // Belt-and-suspenders: the calendar itself never renders a clickable
      // button for days before the item's start date, but guard here too in
      // case of stale/cached HTML.
      if (dateStr < getItemStartDate(item)) return;

      const entryId = itemId + '_' + dateStr;
      const existingIdx = appData.expenses.findIndex(e => e.id === entryId);

      if (existingIdx > -1) {
        appData.expenses.splice(existingIdx, 1);
      } else {
        appData.expenses.push({
          id: entryId,
          amount: getEffectivePrice(item, dateStr),
          category: item.category,
          subCategory: item.subCategory || null,
          date: dateStr,
          note: item.name
        });
      }
      saveState();
      navigate(currentTab);
    }

    // How many days out counts as "near expiry" for due/expiry items.
    const NEAR_EXPIRY_DAYS = 7;

    // Whole days between today and a YYYY-MM-DD due date (negative = already past).
    function daysUntil(dueDateStr) {
      const today = new Date(getTodayStr() + 'T00:00:00');
      const due = new Date(dueDateStr + 'T00:00:00');
      return Math.round((due - today) / 86400000);
    }

    function getItemUrgency(dueDateStr) {
      const diff = daysUntil(dueDateStr);
      if (diff < 0) return 'expired';
      if (diff <= NEAR_EXPIRY_DAYS) return 'soon';
      return 'ok';
    }

    function urgencyBadge(urgency) {
      if (urgency === 'expired') return '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-600">EXPIRED</span>';
      if (urgency === 'soon') return '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-600">DUE SOON</span>';
      return '';
    }

    function renderItems(container) {
      container.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-sm font-bold text-slate-800">Due & Expiry Tracking</h2>
          <div class="flex gap-2">
            <button onclick="checkExpiryStatus()" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg font-semibold hover:bg-amber-100 transition"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Check</button>
            <button onclick="openDueItemForm('Bill')" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow-sm hover:bg-blue-700">+ Add Item</button>
          </div>
        </div>
        <div class="space-y-2 mt-3">
          ${appData.items.filter(i => !i.completed).map(i => {
            const urgency = getItemUrgency(i.dueDate);
            const borderClass = urgency === 'expired' ? 'border-rose-200' : urgency === 'soon' ? 'border-amber-200' : 'border-slate-100';
            return `
              <div class="bg-white p-3 rounded-xl border ${borderClass} flex items-center justify-between shadow-sm">
                <div>
                  <div class="flex items-center gap-1.5">
                    <p class="text-xs font-bold text-slate-800">${i.title}</p>
                    ${urgencyBadge(urgency)}
                  </div>
                  <p class="text-[10px] text-slate-400">${i.type} • Due: ${i.dueDate}</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button onclick="markItemComplete('${i.id}')" class="text-[10px] px-2.5 py-1.5 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg font-bold hover:bg-emerald-100 transition">Done</button>
                  <button onclick="openDueItemForm(undefined, '${i.id}')" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-300 hover:text-blue-500 hover:bg-blue-50 transition" title="Edit"><i class="fa-solid fa-pencil text-[11px]"></i></button>
                  <button onclick="deleteDueItem('${i.id}')" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition" title="Delete"><i class="fa-solid fa-trash text-[11px]"></i></button>
                </div>
              </div>
            `;
          }).join('')}
          ${appData.items.filter(i => !i.completed).length === 0 ? '<div class="text-center py-10 bg-white rounded-xl border border-dashed border-slate-200"><p class="text-xs text-slate-400">All caught up! No pending items.</p></div>' : ''}
        </div>
      `;
    }

    // Opens the shared form modal as a report of everything expired or due
    // within NEAR_EXPIRY_DAYS - a quick "anything I need to worry about?" check.
    function checkExpiryStatus() {
      const pending = appData.items.filter(i => !i.completed);
      const expired = pending.filter(i => getItemUrgency(i.dueDate) === 'expired');
      const soon = pending.filter(i => getItemUrgency(i.dueDate) === 'soon');

      const renderGroup = (title, colorClass, list) => list.length === 0 ? '' : `
        <div class="space-y-1.5">
          <p class="text-[10px] font-bold uppercase tracking-wide ${colorClass}">${title} (${list.length})</p>
          ${list.map(i => `
            <div class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100">
              <div>
                <p class="text-xs font-bold text-slate-800">${i.title}</p>
                <p class="text-[10px] text-slate-400">${i.type} &bull; Due: ${i.dueDate}</p>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="closeFormModal(); markItemComplete('${i.id}')" class="text-[10px] px-2 py-1 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg font-bold hover:bg-emerald-100 transition">Done</button>
                <button onclick="closeFormModal(); openDueItemForm(undefined, '${i.id}')" class="w-6 h-6 rounded-lg flex items-center justify-center text-slate-300 hover:text-blue-500 hover:bg-blue-50 transition" title="Edit"><i class="fa-solid fa-pencil text-[10px]"></i></button>
                <button onclick="deleteDueItem('${i.id}'); checkExpiryStatus();" class="w-6 h-6 rounded-lg flex items-center justify-center text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition" title="Delete"><i class="fa-solid fa-trash text-[10px]"></i></button>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3"><i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>Expiry Check</h3>
        <div class="space-y-3 max-h-[60vh] overflow-y-auto">
          ${expired.length === 0 && soon.length === 0
            ? '<p class="text-xs text-slate-400 text-center py-6">All clear! Nothing expired or due within ' + NEAR_EXPIRY_DAYS + ' days.</p>'
            : renderGroup('Already Expired', 'text-rose-600', expired) + renderGroup('Due Within ' + NEAR_EXPIRY_DAYS + ' Days', 'text-amber-600', soon)
          }
        </div>
        <button onclick="closeFormModal()" class="w-full mt-4 py-2.5 text-xs border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition">Close</button>
      `;
    }

    // Modal Control
    function openQuickAddModal() { document.getElementById('quickAddModal').classList.remove('hidden'); }
    function closeQuickAddModal(e) { document.getElementById('quickAddModal').classList.add('hidden'); }

    // Collapsible side drawer - currently just houses Settings (see the
    // markup comment above the <aside>). Slides in via a transform, same
    // show/hide-backdrop pattern as the other overlays in this app.
    function openSideNav() {
      document.getElementById('sideNavBackdrop').classList.remove('hidden');
      document.getElementById('sideNav').classList.remove('-translate-x-full');
    }
    function closeSideNav() {
      document.getElementById('sideNavBackdrop').classList.add('hidden');
      document.getElementById('sideNav').classList.add('-translate-x-full');
    }
    function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

    // Logic: Expenses
    function openExpenseForm() {
      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      const catOptions = Object.keys(appData.categories).map(c => `<option value="${c}">${c}</option>`).join('');

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3">Add Expense</h3>
        <form onsubmit="saveExpense(event)" class="space-y-3">
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Amount (₹)</label>
            <input type="number" required id="expAmount" step="any" class="w-full text-base font-bold p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Category</label>
              <select id="expCategory" onchange="updateSubCategoryDropdown()" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
                ${catOptions}
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Sub-category</label>
              <select id="expSubCategory" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
                <!-- Injected via JS -->
              </select>
            </div>
          </div>

          <div>
            <label class="text-[11px] font-semibold text-slate-400">Date</label>
            <input type="date" required id="expDate" value="${getTodayStr()}" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
          </div>
          ${appData.familyMembers.length > 0 ? `
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Paid By (Optional)</label>
              <select id="expPaidBy" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
                <option value="">-- Not specified --</option>
                ${appData.familyMembers.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}
              </select>
            </div>
          ` : ''}
          ${appData.tags.length > 0 ? `
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Tag (Optional)</label>
              <select id="expTag" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
                <option value="">-- No tag --</option>
                ${appData.tags.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
              </select>
            </div>
          ` : ''}
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Description / Note (Optional)</label>
            <input type="text" id="expNote" placeholder="e.g. Lunch, Fuel, Groceries" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeFormModal()" class="flex-1 py-2.5 text-xs border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition">Cancel</button>
            <button type="submit" class="flex-1 py-2.5 text-xs bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">Save Expense</button>
          </div>
        </form>
      `;
      
      updateSubCategoryDropdown();
    }

    function updateSubCategoryDropdown() {
      const cat = document.getElementById('expCategory').value;
      const subSelect = document.getElementById('expSubCategory');
      const subs = appData.categories[cat] || [];
      
      if (subs.length === 0) {
        subSelect.innerHTML = '<option value="">None</option>';
        subSelect.disabled = true;
        subSelect.classList.add('bg-slate-50', 'text-slate-400');
      } else {
        subSelect.innerHTML = '<option value="">-- Select --</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
        subSelect.disabled = false;
        subSelect.classList.remove('bg-slate-50', 'text-slate-400');
      }
    }

    function saveExpense(e) {
      e.preventDefault();
      // The Paid By select only renders when there's at least one family
      // member (see openExpenseForm) - null-safe read so this still works
      // fine when it's absent from the DOM entirely.
      const paidByEl = document.getElementById('expPaidBy');
      const tagEl = document.getElementById('expTag');
      const newExp = {
        id: 'exp_' + Date.now(),
        amount: parseFloat(document.getElementById('expAmount').value),
        category: document.getElementById('expCategory').value,
        subCategory: document.getElementById('expSubCategory').value || null,
        date: document.getElementById('expDate').value,
        note: document.getElementById('expNote').value,
        paidBy: (paidByEl && paidByEl.value) || null,
        tag: (tagEl && tagEl.value) || null
      };
      appData.expenses.push(newExp);
      saveState();
      closeFormModal();
      navigate(currentTab);
    }

    // Logic: Due Items
    // Shared by both "Add Item" and the pencil/Edit button on an existing
    // item - pass an `editId` to pre-fill every field from that item and
    // switch the form into update mode (see saveDueItem below). Handy for
    // fixing a typo'd title, a wrong amount, or - the main reason this got
    // added - correcting a recurring item's due date after the fact (e.g.
    // the auto-calculated next date from a payment wasn't quite right and
    // nobody caught it in the payment modal at the time).
    function openDueItemForm(defaultType = 'Bill', editId = null) {
      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      const existing = editId ? appData.items.find(i => i.id === editId) : null;
      const type = existing ? existing.type : defaultType;
      const recurrence = existing ? existing.recurrence : 'None';

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3">${existing ? 'Edit' : 'Add'} Reminder / Due Item</h3>
        <form onsubmit="saveDueItem(event, ${existing ? `'${editId}'` : 'null'})" class="space-y-3">
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Title / Name</label>
            <input type="text" required id="itemTitle" value="${existing ? existing.title : ''}" placeholder="e.g. Car Insurance, Electricity Bill" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Type</label>
              <select id="itemType" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
                <option value="Bill" ${type === 'Bill' ? 'selected' : ''}>Bill</option>
                <option value="Subscription" ${type === 'Subscription' ? 'selected' : ''}>Subscription</option>
                <option value="Document" ${type === 'Document' ? 'selected' : ''}>Document</option>
                <option value="Warranty" ${type === 'Warranty' ? 'selected' : ''}>Warranty</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-400">Amount (Optional)</label>
              <input type="number" id="itemAmount" value="${existing && existing.amount != null ? existing.amount : ''}" placeholder="₹0" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
            </div>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Due / Expiry Date</label>
            <input type="date" required id="itemDueDate" value="${existing ? existing.dueDate : ''}" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Recurrence</label>
            <select id="itemRecurrence" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
              <option value="None" ${recurrence === 'None' ? 'selected' : ''}>None (One time)</option>
              <option value="Monthly" ${recurrence === 'Monthly' ? 'selected' : ''}>Monthly</option>
              <option value="Quarterly" ${recurrence === 'Quarterly' ? 'selected' : ''}>Every 3 Months</option>
              <option value="Yearly" ${recurrence === 'Yearly' ? 'selected' : ''}>Yearly</option>
            </select>
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeFormModal()" class="flex-1 py-2.5 text-xs border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition">Cancel</button>
            <button type="submit" class="flex-1 py-2.5 text-xs bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">${existing ? 'Save Changes' : 'Save Item'}</button>
          </div>
        </form>
      `;
    }

    function saveDueItem(e, editId) {
      e.preventDefault();
      const fields = {
        title: document.getElementById('itemTitle').value,
        type: document.getElementById('itemType').value,
        amount: document.getElementById('itemAmount').value ? parseFloat(document.getElementById('itemAmount').value) : null,
        dueDate: document.getElementById('itemDueDate').value,
        recurrence: document.getElementById('itemRecurrence').value
      };

      if (editId) {
        const item = appData.items.find(i => i.id === editId);
        if (item) Object.assign(item, fields);
      } else {
        appData.items.push({ id: 'item_' + Date.now(), completed: false, ...fields });
      }

      saveState();
      closeFormModal();
      navigate(currentTab);
    }

    function markItemComplete(id) {
      const item = appData.items.find(i => i.id === id);
      if (!item) return;

      // Only a real payment (item has an amount) needs the "who paid"
      // question - a plain reminder/document with no amount just gets
      // advanced/completed immediately, same as before.
      if (item.amount) {
        openDueItemPaymentModal(id);
        return;
      }

      advanceOrCompleteDueItem(item);
      saveState();
      navigate(currentTab);
    }

    // Small confirmation step before logging a due item's payment as an
    // expense - lets the user optionally tag who actually paid it (same
    // "Paid By" concept as the regular Add Expense form) AND, for recurring
    // items, review/edit the auto-calculated next due date before it's
    // locked in. Skipped entirely for items with no amount (see
    // markItemComplete above).
    function openDueItemPaymentModal(id) {
      const item = appData.items.find(i => i.id === id);
      if (!item) return;

      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      const isRecurring = item.recurrence && item.recurrence !== 'None';
      const suggestedNextDate = isRecurring ? calculateNextRecurrenceDate(item.dueDate, item.recurrence) : null;

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-1">Log Payment: ${item.title}</h3>
        <p class="text-[11px] text-slate-400 mb-3">This adds ₹${Number(item.amount).toLocaleString()} to your Expense Log.</p>
        <form onsubmit="confirmDueItemPayment(event, '${id}')" class="space-y-3">
          ${isRecurring ? `
            <div>

    function confirmDueItemPayment(e, id) {
      e.preventDefault();
      const item = appData.items.find(i => i.id === id);
      if (!item) { closeFormModal(); return; }

      const paidByEl = document.getElementById('dueItemPaidBy');
      const nextDateEl = document.getElementById('dueItemNextDate');
      appData.expenses.push({
        id: 'exp_' + Date.now(),
        amount: item.amount,
        category: item.type === 'Subscription' ? 'Entertainment' : 'Bills',
        subCategory: item.title,
        date: getTodayStr(),
        note: item.title + ' payment',
        paidBy: (paidByEl && paidByEl.value) || null
      });

      // Empty/missing field (user cleared it, or it's a one-time item that
      // never had the field at all) falls back to the auto-calculated date -
      // only an explicit non-empty value overrides it.
      advanceOrCompleteDueItem(item, nextDateEl && nextDateEl.value);
      saveState();
      closeFormModal();
      navigate(currentTab);
    }

    // Pure date math: what's the next due date after `dueDate`, given a
    // recurrence interval. Pulled out on its own so openDueItemPaymentModal
    // can use it to PRE-FILL an editable field instead of the next date just
    // being silently decided with no way to correct it (e.g. paid a few
    // days early/late, or the real next bill date doesn't land exactly on
    // the interval).
    function calculateNextRecurrenceDate(dueDate, recurrence) {
      const nextDate = new Date(dueDate);
      if (recurrence === 'Monthly') nextDate.setMonth(nextDate.getMonth() + 1);
      else if (recurrence === 'Quarterly') nextDate.setMonth(nextDate.getMonth() + 3);
      else if (recurrence === 'Yearly') nextDate.setFullYear(nextDate.getFullYear() + 1);
      return formatDateLocal(nextDate);
    }

    // Shared "what happens to the due item ITSELF after a payment was
    // logged (or skipped, for amount-less items)" step - advances a
    // recurring item's due date (to `explicitNextDate` if one was given, e.g.
    // from the payment modal's editable field, else auto-calculated from the
    // interval), or marks a one-off item complete.
    function advanceOrCompleteDueItem(item, explicitNextDate) {
      if (item.recurrence && item.recurrence !== 'None') {
        item.dueDate = explicitNextDate || calculateNextRecurrenceDate(item.dueDate, item.recurrence);
      } else {
        item.completed = true;
      }
    }

    function deleteDueItem(id) {
      const item = appData.items.find(i => i.id === id);
      if (!item) return;
      if (!confirm(`Delete "${item.title}"? It'll be removed from Due & Expiry Tracking entirely. Any expenses already logged from it in the past are NOT affected.`)) return;

      appData.items = appData.items.filter(i => i.id !== id);
      saveState();

    // markup never drifts out of sync with Home/Expenses.

      // selected one got deleted in Settings) - avoids a pointless "pick a

      if (reportSelectedTagId && !appData.tags.some(t => t.id === reportSelectedTagId)) {

      const tagExpenses = appData.expenses.filter(e => e.tag === reportSelectedTagId);

      // Category-wise breakdown, biggest spend first.
      const byCategory = {};
      tagExpenses.forEach(e => {

            <i class="fa-brands fa-google-drive text-amber-500 text-lg"></i>
            <h3 class="font-bold text-slate-800 text-sm">Google Drive Sync</h3>
          </div>

          <div class="flex items-center justify-between text-[11px] bg-slate-50 rounded-lg px-3 py-2 border border-slate-100">
            <span class="text-slate-400 font-semibold">Backup folder</span>
            <span class="text-slate-700 font-bold">${GOOGLE_DRIVE_BACKUP_FOLDER_NAME}</span>
          </div>

          ${!isDriveConfigured ? `
            <p class="text-[10px] text-amber-600 bg-amber-50 border border-amber-100 rounded-lg px-3 py-2">
              <i class="fa-solid fa-triangle-exclamation mr-1"></i> Not configured yet - set <code class="font-mono">GOOGLE_OAUTH_CLIENT_ID</code> in <code class="font-mono">js/config.js</code> to enable Drive backup.
            </p>
          ` : isConnected
            ? `<button onclick="disconnectDrive()" class="w-full py-2.5 border border-rose-200 rounded-xl text-xs font-semibold text-rose-600 flex items-center justify-center gap-2 hover:bg-rose-50 transition">
                <i class="fa-solid fa-link-slash"></i> Disconnect Google Drive
               </button>`
            : `<button onclick="authenticateGoogleDrive()" class="w-full py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 flex items-center justify-center gap-2 hover:bg-slate-50 hover:shadow-sm transition">
                <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
                  <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                  <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                  <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                  <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Sign in with Google
               </button>`
          }

          <div class="w-full h-px bg-slate-100 my-2"></div>

          <div class="grid grid-cols-2 gap-2">
            <button id="btnBackupDrive" onclick="backupToGoogleDrive()" class="py-2.5 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 transition disabled:opacity-50" ${!isConnected ? 'disabled' : ''}>
              <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Upload to Drive
            </button>
            <button id="btnRestoreDrive" onclick="restoreFromGoogleDrive()" class="py-2.5 border border-blue-600 text-blue-600 rounded-xl text-xs font-semibold hover:bg-blue-50 transition disabled:opacity-50" ${!isConnected ? 'disabled' : ''}>
              <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Restore Data
            </button>
          </div>
          
          <p id="driveSyncNotice" class="text-[11px] text-center text-slate-400 font-medium h-4"></p>
        </div>

        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3 mt-4">
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-database text-blue-500"></i>
            <h3 class="font-bold text-slate-800 text-sm">Local Storage by Year</h3>
          </div>
          <p class="text-[10px] text-slate-400 -mt-2">Home and Expenses only ever show ${currentYearStr()}. Restoring a different year for Compare automatically evicts whatever other year was here before it - so this list should normally show at most one entry. Delete it manually any time to free space sooner; your full history stays safe on Drive regardless.</p>
          ${(() => {
            const currentYear = currentYearStr();
            const localOtherYears = Array.from(new Set(appData.expenses.map(e => yearMonthOf(e.date).slice(0, 4))))
              .filter(y => y && y !== currentYear)
              .sort()
              .reverse();
            if (localOtherYears.length === 0) {
              return '<p class="text-xs text-slate-400 text-center py-2">No other years stored locally right now.</p>';
            }
            return localOtherYears.map(y => {
              const count = expensesInYear(y).length;
              return `
                <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                  <div>
                    <p class="text-xs font-bold text-slate-700">${y}</p>
                    <p class="text-[10px] text-slate-400">${count} expense(s) stored locally</p>
                  </div>
                  <button onclick="deleteYearDataFromSettings('${y}')" class="text-[11px] font-semibold text-rose-600 border border-rose-200 px-3 py-1.5 rounded-lg hover:bg-rose-50 transition">
                    <i class="fa-solid fa-trash mr-1"></i>Delete
                  </button>
                </div>
              `;
            }).join('');
          })()}
        </div>

        <div class="bg-white p-4 rounded-2xl border border-rose-100 shadow-sm space-y-3 mt-4">
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-triangle-exclamation text-rose-500"></i>
            <h3 class="font-bold text-rose-700 text-sm">Danger Zone</h3>
          </div>
          <p class="text-[10px] text-slate-400 -mt-2">Permanently deletes every logged expense (including calendar-logged recurring entries) AND every Splitwise group (members + their expenses). Categories, sub-categories, recurring items, and due items are left exactly as they are.</p>
          <button onclick="clearAllExpenses()" class="w-full py-2.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl text-xs font-bold hover:bg-rose-100 transition">
            <i class="fa-solid fa-trash mr-1"></i> Clear All Expenses &amp; Splitwise Data
          </button>

          <p class="text-[10px] text-slate-400 -mb-1">Deletes your Drive backup - all expense history and Splitwise groups stored there. settings.json (categories/recurring/due items) is kept. Data on THIS device is untouched - back it up again any time.</p>
          <button onclick="deleteAllDriveBackupsExceptSettings()" class="w-full py-2.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl text-xs font-bold hover:bg-rose-100 transition disabled:opacity-50" ${!isConnected ? 'disabled' : ''}>
            <i class="fa-brands fa-google-drive mr-1"></i> Delete All Drive Backups (Keep Settings)
          </button>
        </div>

        <p class="text-center text-[10px] text-slate-400 mt-4 pb-2">
          <a href="./privacy.html" class="font-semibold text-slate-500 hover:text-blue-600 underline underline-offset-2">Privacy Policy</a>
        </p>
      `;
    }

    function clearAllExpenses() {
      const splitCount = splitGroups.length || 0;
      if (appData.expenses.length === 0 && splitCount === 0) {
        alert('There are no expenses or Splitwise groups to clear.');
        return;
      }
      const confirmed = confirm(`This will permanently delete all ${appData.expenses.length} logged expense(s) and all Splitwise groups (with their members and expenses). Categories, sub-categories, recurring items, and due items will NOT be affected. This cannot be undone. Continue?`);
      if (!confirmed) return;

      appData.expenses = [];
      saveState();
      clearAllSplitGroups().then(() => {
        renderSettings(document.getElementById('mainContainer'));
        alert('All expenses and Splitwise data cleared.');
      });
    }

    // Frees up local space by dropping one year's worth of expenses from
    // IndexedDB. Deliberately does NOT touch Google Drive (see
    // deleteYearDataLocally() in js/storage.js) - Restore Data can always
    // bring the year back down later. The current year is off-limits here
    // (enforced both in the list above AND inside deleteYearDataLocally
    // itself) since Home/Expenses depend on it always being present.
    async function deleteYearDataFromSettings(year) {
      if (year === currentYearStr()) {
        alert(`${year} is the active year and can't be deleted here - Home and Expenses need it. Use "Clear All Expenses & Splitwise Data" in the Danger Zone below if you really want to wipe everything.`);
        return;
      }

      const count = expensesInYear(year).length;
      if (!confirm(`Remove ${count} expense(s) for ${year} from this device?\n\nYour Drive backup keeps the full history untouched - use Restore Data any time to bring ${year} back.`)) return;

      try {
        await deleteYearDataLocally(year);
      } catch (err) {
        alert(err.message);
        return;
      }
      renderSettings(document.getElementById('mainContainer'));
    }

    function addRecurringItem(e) {
      e.preventDefault();
      const name = document.getElementById('newRecurringName').value.trim();
      const category = document.getElementById('newRecurringCategory').value;
      const price = parseFloat(document.getElementById('newRecurringPrice').value) || 0;
      const startDate = document.getElementById('newRecurringStartDate').value || getTodayStr();
      if (!name) return;

      appData.recurringItems.push({
        id: 'recur_' + Date.now(),
        name,
        category,
        subCategory: null,
        price,
        startDate,
        priceHistory: [{ from: startDate, price }]
      });
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteRecurringItem(id) {
      if (!confirm('Remove this recurring item? Past logged expenses will NOT be affected — only future calendar toggles.')) return;
      appData.recurringItems = appData.recurringItems.filter(i => i.id !== id);
      if (selectedRecurringItemId === id) selectedRecurringItemId = null;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    // --- Family Members (Settings) ------------------------------------------
    // Plain {id, name} labels - see getFamilyMemberName() in
    // js/data-model.js for the display-side lookup used by expense rows,
    // the Add Expense/due-item-payment "Paid By" dropdowns, and Compare.
    function addFamilyMember() {
      const input = document.getElementById('newFamilyMemberName');
      const name = input.value.trim();
      if (!name) return;
      if (appData.familyMembers.some(m => m.name.toLowerCase() === name.toLowerCase())) {
        alert('That family member already exists.');
        return;
      }
      appData.familyMembers.push({ id: 'member_' + Date.now(), name });
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteFamilyMember(id) {
      const member = appData.familyMembers.find(m => m.id === id);
      if (!member) return;

      const inUseCount = appData.expenses.filter(e => e.paidBy === id).length;
      const msg = inUseCount > 0
        ? `"${member.name}" is tagged as "Paid By" on ${inUseCount} existing expense(s). Those will keep showing "${member.name}" — you just won't be able to pick them for new entries. Delete anyway?`
        : `Delete family member "${member.name}"?`;
      if (!confirm(msg)) return;

      appData.familyMembers = appData.familyMembers.filter(m => m.id !== id);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    // --- Tags (Settings) -----------------------------------------------------
    // Plain {id, name} labels, same shape/spirit as Family Members above -
    // see getTagName() in js/data-model.js for the display-side lookup used
    // by expense rows, the Add Expense "Tag" dropdown, and the Reports view.
    function addTag() {
      const input = document.getElementById('newTagName');
      const name = input.value.trim();
      if (!name) return;
      if (appData.tags.some(t => t.name.toLowerCase() === name.toLowerCase())) {
        alert('That tag already exists.');
        return;
      }
      appData.tags.push({ id: 'tag_' + Date.now(), name });
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteTag(id) {
      const tag = appData.tags.find(t => t.id === id);
      if (!tag) return;

      const inUseCount = appData.expenses.filter(e => e.tag === id).length;
      const msg = inUseCount > 0
        ? `"${tag.name}" is used on ${inUseCount} existing expense(s). Those will keep showing "${tag.name}" but it will disappear from the Reports tag picker and can't be picked for new entries. Delete anyway?`
        : `Delete tag "${tag.name}"?`;
      if (!confirm(msg)) return;

      appData.tags = appData.tags.filter(t => t.id !== id);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    // Opens the shared form modal to schedule a price change for a recurring
    // item, effective from a chosen date. Days before that date keep using
    // whatever price was effective then; already-logged expenses are snapshots
    // and are never retroactively edited.
    function openPriceChangeForm(itemId) {
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item) return;

      const modal = document.getElementById('formModal');
      const content = document.getElementById('formModalContent');
      modal.classList.remove('hidden');

      content.innerHTML = `
        <h3 class="text-sm font-bold text-slate-800 mb-3">Change Price: ${item.name}</h3>
        <form onsubmit="savePriceChange(event, '${itemId}')" class="space-y-3">
          <div>
            <label class="text-[11px] font-semibold text-slate-400">New Price per Day (₹)</label>
            <input type="number" required id="priceChangeAmount" step="any" value="${getEffectivePrice(item)}" class="w-full text-base font-bold p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-[11px] font-semibold text-slate-400">Effective From</label>
            <input type="date" required id="priceChangeDate" min="${getItemStartDate(item)}" value="${getTodayStr() < getItemStartDate(item) ? getItemStartDate(item) : getTodayStr()}" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 outline-none focus:border-blue-500 bg-white">
            <p class="text-[9px] text-slate-400 mt-1">Days before this date keep the old price. Expenses already logged never change. Can't be earlier than ${getItemStartDate(item)}, when this item started.</p>
          </div>
          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeFormModal()" class="flex-1 py-2.5 text-xs border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition">Cancel</button>
            <button type="submit" class="flex-1 py-2.5 text-xs bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">Save</button>
          </div>
        </form>
      `;
    }

    function savePriceChange(e, itemId) {
      e.preventDefault();
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item) return;

      const price = parseFloat(document.getElementById('priceChangeAmount').value);
      const from = document.getElementById('priceChangeDate').value;
      if (isNaN(price) || !from) return;

      const startDate = getItemStartDate(item);
      if (from < startDate) {
        alert(`This item started on ${startDate} - a price change can't be effective before that. Pick ${startDate} or later.`);
        return;
      }

      if (!Array.isArray(item.priceHistory) || item.priceHistory.length === 0) {
        item.priceHistory = [{ from: '1970-01-01', price: Number(item.price) || 0 }];
      }

      // Replace a change already scheduled for that exact date, else append a new one.
      const existingIdx = item.priceHistory.findIndex(h => h.from === from);
      if (existingIdx > -1) {
        item.priceHistory[existingIdx].price = price;
      } else {
        item.priceHistory.push({ from, price });
      }
      // Always re-sort chronologically - entries can be added/edited in any
      // order, but everything downstream (getEffectivePrice, the badge list
      // in Settings) assumes ascending-by-date order.
      item.priceHistory.sort((a, b) => a.from.localeCompare(b.from));
      item.price = getEffectivePrice(item); // keep the cached "today" price in sync

      saveState();
      closeFormModal();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deletePriceChange(itemId, from) {
      const item = appData.recurringItems.find(i => i.id === itemId);
      if (!item || !Array.isArray(item.priceHistory) || item.priceHistory.length <= 1) return;

      const entry = item.priceHistory.find(h => h.from === from);
      if (!entry) return;
      if (!confirm(`Remove the ₹${entry.price} price change effective ${from}?`)) return;

      item.priceHistory = item.priceHistory.filter(h => h.from !== from);
      item.price = getEffectivePrice(item);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function addCategory() {
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();
      if (!name) return;
      if (appData.categories[name]) {
        alert('That category already exists.');
        return;
      }
      appData.categories[name] = [];
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteCategory(name) {
      const inUseCount = appData.expenses.filter(e => e.category === name).length;
      const msg = inUseCount > 0
        ? `"${name}" is used on ${inUseCount} existing expense(s). Those will keep showing "${name}" — you just won't be able to pick it for new entries. Delete anyway?`
        : `Delete category "${name}"?`;
      if (!confirm(msg)) return;

      delete appData.categories[name];
      if (selectedCategoryForSub === name) selectedCategoryForSub = null;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function onSubCategoryCategoryChange(name) {
      selectedCategoryForSub = name;
      renderSettings(document.getElementById('mainContainer'));
    }

    // --- Monthly Budget (Settings) -----------------------------------------
    // See getBudgetForMonth/getBudgetStatus in js/data-model.js for how these
    // two numbers (global default + per-month overrides) turn into Home's
    // color-coded progress bar.
    function saveGlobalBudget() {
      const input = document.getElementById('globalBudgetInput');
      const amount = parseFloat(input.value) || 0;
      appData.budgets.global = amount;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function saveMonthlyBudgetOverride() {
      const month = document.getElementById('budgetOverrideMonth').value;
      const amount = parseFloat(document.getElementById('budgetOverrideAmount').value) || 0;
      if (!month) return;
      // Belt-and-suspenders alongside the input's min= attribute - a locked
      // past month must never be editable, full stop, regardless of how the
      // value made it into the field.
      if (!isBudgetMonthEditable(month)) {
        alert(`${month} is a past month and its budget is locked - only the running month and future months can be set.`);
        return;
      }
      if (amount <= 0) {
        alert('Enter an amount greater than 0 - to remove an existing override, use the x button on its chip instead.');
        return;
      }
      appData.budgets.monthly[month] = amount;
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteMonthlyBudgetOverride(month) {
      if (!isBudgetMonthEditable(month)) {
        alert(`${month} is a past month and its budget is locked - it can't be removed.`);
        return;
      }
      if (!confirm(`Remove the budget override for ${month}? It'll fall back to the global monthly budget.`)) return;
      delete appData.budgets.monthly[month];
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function addSubCategory() {
      const catName = selectedCategoryForSub || Object.keys(appData.categories)[0];
      if (!catName) return;

      const input = document.getElementById('newSubCategoryName');
      const sub = input.value.trim();
      if (!sub) return;

      if (!appData.categories[catName]) appData.categories[catName] = [];
      if (appData.categories[catName].includes(sub)) {
        alert('That sub-category already exists.');
        return;
      }

      appData.categories[catName].push(sub);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }

    function deleteSubCategory(catName, sub) {
      const inUseCount = appData.expenses.filter(e => e.category === catName && e.subCategory === sub).length;
      const msg = inUseCount > 0
        ? `"${sub}" is used on ${inUseCount} existing expense(s). Those will keep showing "${sub}" — you just won't be able to pick it for new entries. Delete anyway?`
        : `Delete sub-category "${sub}" from "${catName}"?`;
      if (!confirm(msg)) return;

      appData.categories[catName] = (appData.categories[catName] || []).filter(s => s !== sub);
      saveState();
      renderSettings(document.getElementById('mainContainer'));
    }


    // Initialize
    window.addEventListener('DOMContentLoaded', initStorage);

    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
